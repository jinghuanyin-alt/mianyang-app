let calCtx={y:new Date().getFullYear(),m:new Date().getMonth(),sel:todayStr()};
function evModal(id){
  const e=id?db.events.find(x=>x.id===id):{title:'',date:calCtx.sel,time:'',note:'',list:db.lists[0].name};
  openModal(`
    <div class="modal-title">${id?'编辑日程':'新建日程'}</div>
    <div class="field"><label>日程标题</label><input id="eTitle" value="${esc(e.title)}" placeholder="要安排什么？"></div>
    <div class="field-row">
      <div class="field"><label>日期</label><input id="eDate" type="date" value="${e.date}"></div>
      <div class="field"><label>时间（可选）</label><input id="eTime" type="time" value="${e.time||''}"></div>
    </div>
    <div class="field"><label>归属维度</label><select id="eList">${db.lists.map(l=>`<option value="${esc(l.name)}" ${e.list===l.name?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div>
    <div class="field"><label>备注</label><textarea id="eNote" placeholder="可选">${esc(e.note)}</textarea></div>
    <div class="modal-actions">
      ${id?'<button class="btn btn-danger" onclick="deleteEvent(\''+id+'\')">删除</button>':''}
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEvent('${id||''}')">保存</button>
    </div>`);
  setTimeout(()=>$('#eTitle').focus(),60);
}
function saveEvent(id){
  const title=$('#eTitle').value.trim();
  if(!title){toast('请填写日程标题');return;}
  const data={title,date:$('#eDate').value||todayStr(),time:$('#eTime').value||'',note:$('#eNote').value,list:$('#eList').value};
  if(id){Object.assign(db.events.find(x=>x.id===id),data);}
  else{db.events.push(Object.assign({id:uid(),created_at:new Date().toISOString()},data));}
  calCtx.sel=data.date;
  save();closeModal();render();toast('已保存');
}
function deleteEvent(id){
  if(!confirm('删除这条日程？'))return;
  db.events=db.events.filter(x=>x.id!==id);save();closeModal();render();
}
const EDIT_SVG='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const EV_SVG='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>';
function calCellItemHtml(it,date){
  if(it.kind==='event'){
    return `<span class="cal-item event">${it.time?`<span class="ci-time">${it.time}</span>`:'<span class="ci-time">·</span>'}<span class="ci-title">${esc(it.title)}</span></span>`;
  }
  const done=instanceDone(it,date);
  return `<span class="cal-item task ${done?'done':''}" style="--cc:${listColor(it.list)}">
    <span class="ci-check"></span><span class="ci-title">${esc(it.title)}</span></span>`;
}
function dayDetailHtml(date){
  const items=itemsOnDate(date);
  return db.lists.map(dim=>{
    const its=items.filter(i=>i.list===dim.name);
    const evs=its.filter(i=>i.kind==='event');
    const ts=its.filter(i=>i.kind==='task');
    const doneN=ts.filter(t=>instanceDone(t,date)).length;
    let body;
    if(!its.length){body='<div class="dim-empty">这一天没有安排</div>';}
    else{
      body=evs.map(e=>`
        <div class="dim-line event">
          <span class="dim-ic">${EV_SVG}</span>
          <span class="dim-time">${e.time||'全天'}</span>
          <span class="dim-t">${esc(e.title)}</span>
          <button class="icon-btn" onclick="evModal('${e.id}')">${EDIT_SVG}</button>
        </div>`).join('')
      +ts.map(t=>{
        const done=instanceDone(t,date),at=instanceDoneAt(t,date);
        return `<div class="dim-line ${done?'done':''}">
          <button class="dim-check" style="--cc:${dim.color}" onclick="toggleInstance('${t.id}','${date}')">${done?ICONS.check:''}</button>
          <span class="dim-t">${esc(t.title)}${t.rrule?`<span class="dim-rr">${rrLabel(t.rrule)}</span>`:''}</span>
          ${done?`<span class="dim-time">${timeHM(at)} 完成</span>`:`<button class="icon-btn" title="开始专注" onclick="openTimer('${t.id}')">${ICONS.play}</button>`}
          <button class="icon-btn" onclick="taskModal('${t.id}')">${EDIT_SVG}</button>
        </div>`;
      }).join('');
    }
    return `<div class="card dim-card">
      <div class="dim-head">
        <span class="dim-dot" style="background:${dim.color}"></span>
        <span class="dim-name">${dim.name}</span>
        <span class="dim-count">任务 ${doneN}/${ts.length}${evs.length?` · 日程 ${evs.length}`:''}</span>
      </div>${body}</div>`;
  }).join('');
}
function renderCalendar(){
  const {y,m,sel}=calCtx;
  const first=new Date(y,m,1);
  const lead=(first.getDay()+6)%7; // 周一起始
  const total=daysInMonth(y,m);
  const prevTotal=daysInMonth(m===0?y-1:y,m===0?11:m-1);
  let cells=[];
  for(let i=0;i<lead;i++)cells.push({d:prevTotal-lead+i+1,other:true});
  for(let d=1;d<=total;d++)cells.push({d,date:y+'-'+pad(m+1)+'-'+pad(d)});
  while(cells.length%7!==0)cells.push({d:cells.length-lead-total+1,other:true});
  while(cells.length<42)cells.push({d:cells.length-lead-total+1,other:true});
  const grid=cells.map(c=>{
    if(c.other)return `<div class="cal-day other"><div class="dnum">${c.d}</div></div>`;
    const items=itemsOnDate(c.date);
    return `<button class="cal-day ${c.date===todayStr()?'today':''} ${c.date===sel?'sel':''}" onclick="calCtx.sel='${c.date}';renderCalendar()">
      <div class="dnum">${c.d}</div>
      ${items.slice(0,3).map(it=>calCellItemHtml(it,c.date)).join('')}
      ${items.length>3?`<span class="cal-more">+${items.length-3}</span>`:''}
    </button>`;
  }).join('');
  $('#page').innerHTML=`
    <div class="page-head"><div class="page-title">日历</div><div class="page-sub">任务与日程直接显示在日历上，点击日期查看当天清单</div></div>
    <div class="card">
      <div class="cal-head">
        <div class="m">${y} 年 ${m+1} 月</div>
        <div class="cal-nav">
          <button class="icon-btn" onclick="calMove(-1)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="btn btn-ghost btn-sm" onclick="calCtx={y:new Date().getFullYear(),m:new Date().getMonth(),sel:todayStr()};renderCalendar()">今天</button>
          <button class="icon-btn" onclick="calMove(1)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="cal-grid">${['一','二','三','四','五','六','日'].map(w=>`<div class="cal-dow">${w}</div>`).join('')}${grid}</div>
    </div>
    <div class="section-row"><h3>${fmtCN(sel)}</h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="taskModal()">${ICONS.plus} 添加任务</button>
        <button class="btn btn-tomato btn-sm" onclick="evModal()">${ICONS.plus} 添加日程</button>
      </div>
    </div>
    ${dayDetailHtml(sel)}`;
}
function calMove(d){
  let {y,m}=calCtx;m+=d;
  if(m<0){m=11;y--;}if(m>11){m=0;y++;}
  calCtx.y=y;calCtx.m=m;renderCalendar();
}

/* ============================================================
   习惯打卡
   ============================================================ */
const HABIT_COLORS=['#2E7D5B','#D14E3A','#BC8427','#3D6B8F','#7A5C9E','#C4567B'];
function checkedToday(hid){return db.habitLogs.some(l=>l.habit_id===hid&&l.date===todayStr());}
function isChecked(hid,date){return db.habitLogs.some(l=>l.habit_id===hid&&l.date===date);}
function habitStreak(hid){
  const d=new Date();let s=0;
  if(!isChecked(hid,dateStr(d)))d.setDate(d.getDate()-1);
  while(isChecked(hid,dateStr(d))){s++;d.setDate(d.getDate()-1);}
  return s;
}
function toggleHabit(hid){
  const i=db.habitLogs.findIndex(l=>l.habit_id===hid&&l.date===todayStr());
  if(i>=0)db.habitLogs.splice(i,1);
  else{db.habitLogs.push({id:uid(),habit_id:hid,date:todayStr(),count:1,checked_at:new Date().toISOString()});
    awardCoins('habit');}
  save();renderHabits();
  if(i<0){SFX.done();coinFly(AWARD_RULE.habit);gainExp(8);checkAchievements();}
}
function habitModal(id){
  const h=id?db.habits.find(x=>x.id===id):{name:'',color:HABIT_COLORS[0]};
  openModal(`
    <div class="modal-title">${id?'编辑习惯':'新建习惯'}</div>
    <div class="field"><label>习惯名称</label><input id="hName" value="${esc(h.name)}" placeholder="如：阅读、运动、喝水"></div>
    <div class="field"><label>颜色</label><div style="display:flex;gap:10px">
      ${HABIT_COLORS.map(c=>`<button type="button" onclick="$$('.h-color').forEach(x=>x.classList.remove('sel'));this.classList.add('sel')" class="h-color ${h.color===c?'sel':''}" data-c="${c}" style="width:30px;height:30px;border-radius:50%;background:${c};border:3px solid ${h.color===c?'#202925':'#fff'};box-shadow:0 0 0 1px var(--line)"></button>`).join('')}
    </div></div>
    <div class="modal-actions">
      ${id?'<button class="btn btn-danger" onclick="deleteHabit(\''+id+'\')">删除</button>':''}
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveHabit('${id||''}')">保存</button>
    </div>`);
  setTimeout(()=>$('#hName').focus(),60);
}
function saveHabit(id){
  const name=$('#hName').value.trim();
  if(!name){toast('请填写习惯名称');return;}
  const sel=$('.h-color.sel');const color=sel?sel.dataset.c:HABIT_COLORS[0];
  if(id){Object.assign(db.habits.find(x=>x.id===id),{name,color});}
  else{db.habits.push({id:uid(),name,color,target:1,created_at:new Date().toISOString(),archived:false});}
  save();closeModal();render();toast('已保存');
}
function deleteHabit(id){
  const h=db.habits.find(x=>x.id===id);
  if(!confirm('删除习惯「'+h.name+'」？历史打卡记录会一并删除。'))return;

function monthGrid(hid){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const total=daysInMonth(y,m);
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="hg-cell future"></div>';
  for(let d=1;d<=total;d++){
    const ds=y+'-'+pad(m+1)+'-'+pad(d);
    const future=ds>todayStr();
    const done=isChecked(hid,ds);
    cells+=`<div class="hg-cell ${future?'future':done?'l4':''} ${ds===todayStr()?'today':''}" title="${ds}"></div>`;
  }
  return '<div class="habit-grid">'+['一','二','三','四','五','六','日'].map(w=>`<div class="hg-dow">${w}</div>`).join('')+cells+'</div>';
}

/* ============================================================
   统计复盘
   ============================================================ */
let statsRange='week';
function rangeBounds(){
  const now=new Date();
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let start;
  if(statsRange==='week'){
    start=new Date(t);
    start.setDate(start.getDate()-((t.getDay()+6)%7));
  }else if(statsRange==='month'){
    start=new Date(now.getFullYear(),now.getMonth(),1);
  }else{
    start=new Date(t);
    start.setDate(start.getDate()-29);
  }
  return {start:dateStr(start),end:dateStr(t),days:Math.round((t-start)/86400000)+1};
}
function eachDay(start,end){
  const out=[];const d=parseDate(start);
  for(;dateStr(d)<=end;d.setDate(d.getDate()+1))out.push(dateStr(d));
  return out;
}
function focusMinutes(p){
  if(p.actual)return p.actual;
  if(p.end_time&&p.start_time)return Math.max(0,Math.round((new Date(p.end_time)-new Date(p.start_time))/60000));
  return 0;
}
function donutHtml(parts){
  const total=parts.reduce((s,p)=>s+p.value,0);
  if(!total)return '<div class="empty" style="padding:18px">还没有专注记录</div>';
  const r=48,c=2*Math.PI*r;
  let acc=0;
  const segs=parts.map(p=>{
    const frac=p.value/total;
    const h=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p.color}" stroke-width="15"
      stroke-dasharray="${(frac*c).toFixed(2)} ${c.toFixed(2)}"
      stroke-dashoffset="${(-acc*c).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    acc+=frac;
    return h;
  }).join('');
  return `<svg viewBox="0 0 140 140" class="donut">${segs}
    <text x="70" y="66" text-anchor="middle" class="donut-num">${total}</text>
    <text x="70" y="85" text-anchor="middle" class="donut-lab">个番茄</text></svg>`;
}
function renderStats(){
  const {start,end,days}=rangeBounds();
  const ps=db.pomodoros.filter(p=>{const d=p.start_time.slice(0,10);return d>=start&&d<=end;});
  const pomoDone=ps.filter(p=>p.completed===1).length;
  const mins=ps.reduce((s,p)=>s+focusMinutes(p),0);
  const focusH=(mins/60).toFixed(1);
  let tasksDone=0;
  db.tasks.forEach(t=>{
    if(t.rrule){
      (t.doneDates||[]).forEach(d=>{
        if(d.completed_at){const x=d.completed_at.slice(0,10);if(x>=start&&x<=end)tasksDone++;}
      });
    }else if(t.status==='done'&&t.completed_at){
      const x=t.completed_at.slice(0,10);if(x>=start&&x<=end)tasksDone++;
    }
  });
  let dueN=0,dueDone=0;
  eachDay(start,end).forEach(d=>{
    db.tasks.forEach(t=>{
      if(taskOccursOn(t,d)){dueN++;if(instanceDone(t,d))dueDone++;}
    });
  });
  const duePct=dueN?Math.round(dueDone/dueN*100):0;
  const habs=db.habits.filter(h=>!h.archived);
  let habDays=0,habDone=0;
  const habRows=habs.map(h=>{
    const created=h.created_at?h.created_at.slice(0,10):start;
    const s0=created>start?created:start;
    const n=Math.max(1,Math.round((parseDate(end)-parseDate(s0))/86400000)+1);
    const done=db.habitLogs.filter(l=>l.habit_id===h.id&&l.date>=s0&&l.date<=end).length;
    habDays+=n;habDone+=done;
    const pct=Math.round(done/n*100);
    return `<div class="hr-row">
      <div class="hr-top"><span class="habit-dot" style="background:${h.color}"></span>
        <span class="hr-name">${esc(h.name)}</span>
        <span class="hr-pct">${done}/${n} · ${pct}%</span></div>
      <div class="hr-track"><div class="hr-fill" style="width:${pct}%;background:${h.color}"></div></div>
    </div>`;
  }).join('');
  const habPct=habDays?Math.round(habDone/habDays*100):0;
  const trend=[];
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=dateStr(d);
    trend.push({ds,n:db.pomodoros.filter(p=>p.completed===1&&p.start_time.slice(0,10)===ds).length,
      lab:d.getDate(),today:ds===todayStr()});
  }
  const maxN=Math.max(1,...trend.map(x=>x.n));
  const dimMap={};
  ps.forEach(p=>{
    const t=p.task_id?db.tasks.find(x=>x.id===p.task_id):null;
    const k=t?t.list:'未分类';
    dimMap[k]=(dimMap[k]||0)+1;
  });
  const dimParts=Object.keys(dimMap).map(k=>({label:k,
    color:k==='未分类'?'#9AA19B':listColor(k),value:dimMap[k]})).sort((a,b)=>b.value-a.value);
  const dimTotal=dimParts.reduce((s,p)=>s+p.value,0);
  const legend=dimParts.map(p=>`<div class="legend-row">
    <span class="legend-dot" style="background:${p.color}"></span>
    <span class="legend-name">${esc(p.label)}</span>
    <span class="legend-val">${p.value} · ${Math.round(p.value/dimTotal*100)}%</span>
  </div>`).join('');
  const rangeNames={week:'本周',month:'本月',days30:'近30天'};
  $('#page').innerHTML=`
    <div class="page-head"><div class="page-title">统计</div>
      <div class="page-sub">${start.replace(/-/g,'/')} — ${end.replace(/-/g,'/')} · 共 ${days} 天</div></div>
    <div class="chips">${['week','month','days30'].map(r=>`<button class="chip ${statsRange===r?'active':''}" onclick="statsRange='${r}';renderStats()">${rangeNames[r]}</button>`).join('')}</div>
    <div class="stats">
      <div class="stat"><div class="stat-num">${pomoDone}<small>个</small></div><div class="stat-label">完成番茄 · ${focusH} 小时</div></div>
      <div class="stat"><div class="stat-num">${tasksDone}<small>项</small></div><div class="stat-label">完成任务 · 到期完成率 ${duePct}%</div></div>
      <div class="stat"><div class="stat-num">${habPct}<small>%</small></div><div class="stat-label">习惯打卡 · ${habDone}/${habDays}</div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-title">近 14 天专注趋势</div>
      <div class="chart-bars">
        ${trend.map(x=>`<div class="bar-col" title="${x.ds}：${x.n} 个番茄">
          <div class="bar-val">${x.n||''}</div>
          <div class="bar-area"><div class="bar ${x.today?'today':''}" style="height:${Math.round(x.n/maxN*100)}%"></div></div>
          <div class="bar-lab">${x.lab}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="stats-grid2" style="margin-top:14px">
      <div class="card">
        <div class="card-title">维度分布（番茄）</div>
        <div class="donut-wrap">
          ${donutHtml(dimParts)}
          ${dimTotal?`<div class="legend">${legend}</div>`:''}
        </div>
      </div>
      <div class="card">
        <div class="card-title">习惯完成率</div>
        ${habs.length?habRows:'<div class="empty">还没有习惯，去打卡页建一个</div>'}
      </div>
    </div>`;
}

/* ---------- 温柔音效（Web Audio 合成，无需音频文件） ---------- */
let audioCtx=null;
function sfxEnabled(){return loadUi().sound!==false;}
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function tone(freq,dur,type,when,vol){
  if(!sfxEnabled())return;
  ensureAudio();if(!audioCtx)return;
  const t=audioCtx.currentTime+(when||0);
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.12,t);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+dur+0.02);
}
const SFX={
  tap(){tone(520,0.07,'sine',0,0.05);},
  done(){tone(659,0.12);tone(880,0.2,'sine',0.09,0.11);},
  harvest(){tone(880,0.1,'triangle',0,0.11);tone(1175,0.16,'triangle',0.06,0.09);},
  buy(){tone(440,0.1,'sine',0,0.09);tone(392,0.13,'sine',0.08,0.07);},
  send(){tone(523,0.12);tone(659,0.14,'sine',0.1,0.09);tone(784,0.22,'sine',0.2,0.09);},
  home(){tone(523,0.16);tone(659,0.18,'sine',0.1,0.09);tone(784,0.28,'sine',0.2,0.1);},
  ach(){tone(784,0.1,'sine',0,0.09);tone(1047,0.28,'sine',0.08,0.11);},
  visitor(){tone(587,0.12,'sine',0,0.08);tone(740,0.16,'sine',0.09,0.07);}
};

function bindSettingsActions(){
  const sc=$('#syncConnectBtn');
  if(sc)sc.onclick=()=>{
    const v=$('#syncToken').value;
    if(!v.trim()){toast('请粘贴 token');return;}
    sc.disabled=true;sc.textContent='连接中…';
    syncConnect(v).then(()=>{renderSettings();toast('已连接并同步');})
      .catch(e=>{toast('连接失败：'+e.message);sc.disabled=false;sc.textContent='连接';});
  };
  const st=$('#syncToken');
  if(st)st.addEventListener('keydown',e=>{if(e.key==='Enter')$('#syncConnectBtn').click();});
  const ad=$('#addDimBtn');
  if(ad)ad.onclick=()=>{
    const v=$('#newDim').value.trim();
    if(!v)return;
    if(db.lists.find(l=>l.name===v)){toast('维度已存在');return;}
    const pal=['#7A5C9E','#C4567B','#3D8A8F','#C9743B','#5C7A4E','#8A6D3B'];
    const used=db.lists.map(l=>l.color);
    const c=pal.find(x=>!used.includes(x))||'#6B736D';
    db.lists.push({name:v,color:c});
    save();renderSettings();toast('已新建维度');
  };
  const nd=$('#newDim');
  if(nd)nd.addEventListener('keydown',e=>{if(e.key==='Enter')$('#addDimBtn').click();});
}
function toggleAutoSync(){syncCfg.auto=!syncCfg.auto;saveSyncCfg();renderSettings();}
function manualSync(){
  toast('同步中…');
  syncNow().then(()=>toast('同步完成')).catch(e=>toast('同步失败：'+e.message));
}
function disconnectSync(){
  if(!confirm('取消本机的同步配置？云端 Gist 数据保留，其他设备不受影响。'))return;
  syncDisconnect();renderSettings();toast('已取消配置');
}
function changeDimColor(name,c){
  const l=db.lists.find(x=>x.name===name);if(!l)return;
  l.color=c;save();renderSettings();
}
function removeDim(name){
  const n=db.tasks.filter(t=>t.list===name).length;
  if(!confirm('删除维度「'+name+'」？'+(n?'其中 '+n+' 个任务将移到「其他」。':'')))return;
  if(!db.lists.find(x=>x.name==='其他'))db.lists.push({name:'其他',color:'#6B736D'});
  db.tasks.forEach(t=>{if(t.list===name)t.list='其他';});
  db.events.forEach(e=>{if(e.list===name)e.list='其他';});
  db.lists=db.lists.filter(l=>l.name!==name);
  save();renderSettings();
}
function updateSetting(k,v){
  v=Number(v);
  const limits={focus:[5,90],short:[1,30],long:[5,60],longEvery:[2,8]};
  if(limits[k]){const [lo,hi]=limits[k];v=Math.min(hi,Math.max(lo,v));}
  db.settings[k]=v;save();
  if(!timer.running&&k==={focus:'focus',short:'short',long:'long'}[timer.mode]){timer.remain=v*60;saveTimer();}
  toast('已保存');
}
function toggleSetting(k){db.settings[k]=!db.settings[k];save();renderSettings();}
function exportData(){
  const blob=new Blob([JSON.stringify({app:'mianyang',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='mianyang-backup-'+todayStr()+'.json';a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出备份');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      const d=obj.data||obj;
      if(!d.tasks||!d.settings)throw new Error('格式不对');
      if(!confirm('导入将覆盖当前全部数据，确定继续？建议先导出当前备份。'))return;
      db=Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)),d);
      save();render();toast('导入成功');
    }catch(e){toast('导入失败：文件格式不正确');}
  };
  reader.readAsText(file);
  input.value='';
}
function clearAll(){
  if(!confirm('确定清空全部任务、日程、番茄记录和习惯？此操作不可恢复。'))return;
  if(!confirm('再次确认：真的要清空所有数据吗？'))return;
  localStorage.removeItem(STORE_KEY);localStorage.removeItem(TIMER_KEY);
  db=JSON.parse(JSON.stringify(DEFAULT_DATA));
  timer={mode:'focus',running:false,remain:25*60,endAt:null,taskId:null,cycle:0,startedAt:null};
  render();toast('已清空');
}

function awardCoins(reason,show){
  const n=AWARD_RULE[reason]||0;
  if(!n)return;

const LEVEL_TITLES=['小奶羊','小羊羔','棉絮羊','云朵羊','软绵绵','旅行羊','风铃羊','小牧羊','远方羊','月亮羊'];
function levelInfo(){
  const exp=db.pet.exp||0;
  let lv=1,acc=0,need=80;
  while(exp>=acc+need){acc+=need;lv++;need=80+(lv-1)*45;}
  return {lv,acc,need,cur:exp-acc,title:LEVEL_TITLES[Math.min(lv-1,LEVEL_TITLES.length-1)]};
}
function gainExp(n){
  if(typeof db.pet.exp!=='number')db.pet.exp=0;
  const before=levelInfo().lv;
  db.pet.exp+=n;
  const li=levelInfo();
  if(li.lv>before){
    const reward=30*li.lv;
    db.coins+=reward;
    toast('小羊升级啦，现在是「'+li.title+'」');
    setTimeout(()=>coinFly(reward),300);
  }
  save();
}
function settleGrow(){
  const now=Date.now(),p=db.pet;
  const today=todayStr();
  const last=p.lastGrow?new Date(p.lastGrow):null;
  if(!p.lastGrow){p.lastGrow=new Date(now).toISOString();return 0;}
  if(last&&todayStr(last)===today){p.lastGrow=new Date(now).toISOString();return 0;}
  // 跨天结算：按自然天数给（每天一次，鼓励打开）
  const days=Math.max(1,Math.round((new Date(today+'T00:00:00')-new Date(todayStr(last)+'T00:00:00'))/86400000));
  const gain=Math.min(GROW_DAILY_CAP,days*GROW_PER_HOUR*4);
  db.coins+=gain;
  p.lastGrow=new Date(now).toISOString();
  return gain;
}
function coinFly(n){
  const el=document.createElement('div');
  el.className='coin-fly';
  el.textContent='+'+n;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

/* ============================================================
   绵羊旅行 · 行囊 / 自主旅行 / 归来结算
   ============================================================ */
function bagFood(){const f=db.pet.bag.find(id=>ITEM_MAP[id]&&ITEM_MAP[id].cat==='food');return f?ITEM_MAP[f]:null;}
function bagGears(){return db.pet.bag.filter(id=>ITEM_MAP[id]&&ITEM_MAP[id].cat==='gear').map(id=>ITEM_MAP[id]);}
function bagLuck(){return db.pet.bag.filter(id=>ITEM_MAP[id]&&ITEM_MAP[id].cat==='charm')
  .reduce((s,id)=>s+(ITEM_MAP[id].luck||0),0);}
function rollRarity(luck){
  const r=Math.random();
  const epicT=0.08+luck*0.05, rareT=0.30+luck*0.08;
  if(r<epicT)return 'epic';if(r<rareT)return 'rare';return 'common';
}
function partner(){return ['小兔子','小刺猬','小松鼠','小乌龟','小鹿'][Math.floor(Math.random()*5)];}
function pickDestination(){
  const gears=bagGears();let pool=[];
  gears.forEach(g=>pool=pool.concat(g.scenes||[]));
  if(!pool.length)pool=SCENES.map(s=>s.id);
  pool=pool.filter((v,i)=>pool.indexOf(v)===i);
  return pool[Math.floor(Math.random()*pool.length)];
}
function addToBag(itemId){
  if((db.inventory[itemId]||0)<=0){toast('你还没有这个物品');return;}
  if(ITEM_MAP[itemId].cat==='food'){
    const old=db.pet.bag.find(id=>ITEM_MAP[id]&&ITEM_MAP[id].cat==='food');
    if(old){db.inventory[old]=(db.inventory[old]||0)+1;db.pet.bag.splice(db.pet.bag.indexOf(old),1);}
  }
  db.inventory[itemId]--;
  if(db.inventory[itemId]<=0)delete db.inventory[itemId];
  db.pet.bag.push(itemId);
  save();renderBag();
}
function removeFromBag(itemId){
  const i=db.pet.bag.indexOf(itemId);if(i<0)return;
  db.pet.bag.splice(i,1);
  db.inventory[itemId]=(db.inventory[itemId]||0)+1;
  save();renderBag();
}
function addToDesk(itemId){
  if((db.inventory[itemId]||0)<=0){toast('你还没有这个物品');return;}
  if(db.desk.length>=4){toast('桌子上只能放 4 个');return;}
  db.inventory[itemId]--;
  if(db.inventory[itemId]<=0)delete db.inventory[itemId];
  db.desk.push(itemId);
  save();renderBag();
}
function takeFromDesk(i){
  const id=db.desk[i];if(!id)return;
  db.desk.splice(i,1);
  db.inventory[id]=(db.inventory[id]||0)+1;
  save();renderBag();
}
function sendOff(){
  const food=bagFood();
  if(!food){toast('要给它准备一个便当，它才有力气出门');return;}
  const dest=pickDestination();
  const now=Date.now();
  const luck=bagLuck();
  const durMs=food.dur*3600000*(0.85+Math.random()*0.4)*(db.pet.bag.some(id=>ITEM_MAP[id]&&ITEM_MAP[id].far)?1.25:1);
  // 消耗便当和四叶草；其余道具/护身符归还
  const foodId=db.pet.bag.find(id=>ITEM_MAP[id]&&ITEM_MAP[id].cat==='food');
  db.pet.bag.forEach(id=>{
    if(id===foodId||id==='charm_clover')return;
    db.inventory[id]=(db.inventory[id]||0)+1;
  });
  db.pet.bag=[];
  Object.assign(db.pet,{state:'away',travelId:uid(),travelStart:new Date(now).toISOString(),
    travelEnd:new Date(now+durMs).toISOString(),destination:dest,travelLuck:luck});
  const mailPts=[];
  if(Math.random()<0.85)mailPts.push(0.3);
  if(food.dur>=3&&Math.random()<0.6)mailPts.push(0.65);
  db.pet.pendingMail=mailPts.map(p=>({at:new Date(now+p*durMs).toISOString(),got:false}));
  db.stats.trips=(db.stats.trips||0)+1;
  save();
  SFX.send();
  toast('它背上包出发啦，等它的消息吧');
  checkAchievements();
  setTimeout(()=>location.hash='#/yard',400);
}
/* 小羊自己看桌子，拿备用便当再次出门 */
function autoTick(){
  const p=db.pet;
  if(p.state!=='home'||!p.autoLeaveAt)return;
  if(Date.now()<p.autoLeaveAt)return;
  const foodIdx=db.desk.findIndex(id=>ITEM_MAP[id]&&ITEM_MAP[id].cat==='food');
  if(foodIdx<0){p.autoLeaveAt=null;save();return;}
  autoSendOff();
}
function autoSendOff(){
  const items=db.desk.slice();
  const foodId=items.find(id=>ITEM_MAP[id].cat==='food');
  const food=ITEM_MAP[foodId];
  db.desk=[];
  const gear=items.filter(id=>id!==foodId);
  let luck=0;
  gear.forEach(id=>{if(ITEM_MAP[id].cat==='charm')luck+=ITEM_MAP[id].luck;});
  const dest=pickDestination();
  const now=Date.now();
  const durMs=food.dur*3600000*(0.85+Math.random()*0.4);
  Object.assign(db.pet,{state:'away',travelId:uid(),travelStart:new Date(now).toISOString(),
    travelEnd:new Date(now+durMs).toISOString(),destination:dest,travelLuck:luck,bag:[],
    pendingMail:[]});
  db.stats.trips=(db.stats.trips||0)+1;
  db.pet.autoLeaveAt=null;
  save();
  toast('它自己看了看桌子，背上包又出门啦');
}
function travelTick(){
  const p=db.pet;if(p.state!=='away')return false;
  const now=Date.now();let changed=false;
  p.pendingMail.forEach(m=>{
    if(!m.got&&now>=new Date(m.at).getTime()){
      m.got=true;
      const v=Math.random();
      const card={id:uid(),scene:p.destination,date:new Date().toISOString(),
        rarity:rollRarity(p.travelLuck||0),with:v<0.25?partner():null,seen:false};
      card.text=makeCardText(card);
      db.postcards.push(card);
      changed=true;
    }
  });
  if(now>=new Date(p.travelEnd).getTime()){
    const s=SCENE_MAP[p.destination];
    const n=1+Math.floor(Math.random()*2)+(Math.random()<0.4?1:0);
    for(let i=0;i<n;i++){
      const r=Math.random();const idx=r<0.6?0:r<0.88?1:2;
      const nm=s.souvenirs[idx];
      if(!db.souvenirs.find(x=>x.name===nm))
        db.souvenirs.push({id:uid(),scene:p.destination,name:nm,date:new Date().toISOString(),
          rarity:idx===0?'common':idx===1?'rare':'epic',seen:false});
    }
    if(Math.random()<0.6){
      const fcard={id:uid(),scene:p.destination,date:new Date().toISOString(),
        rarity:rollRarity(p.travelLuck||0),final:true,seen:false};
      fcard.text=makeCardText(fcard);
      db.postcards.push(fcard);
    }
    p.state='back';p.lastReturn=new Date().toISOString();
    changed=true;
  }
  if(changed)save();
  return changed;
}
/* 回家开箱仪式 */
let _mailItems=[],_mailIndex=0;
function openHomeMail(){
  const cards=db.postcards.filter(x=>!x.seen);
  const sovs=db.souvenirs.filter(x=>!x.seen);
  _mailItems=[];
  cards.forEach(c=>_mailItems.push({type:'card',data:c}));
  sovs.forEach(s=>_mailItems.push({type:'sov',data:s}));
  if(!_mailItems.length){welcomeHome();return;}
  _mailIndex=0;
  showMailStep(0);
}
function showMailStep(i){
  const it=_mailItems[i],isLast=i===_mailItems.length-1;
  const nav=`<div style="margin-top:14px;display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost" onclick="finishMailAll()">跳过</button>
      <button class="btn btn-primary btn-block" onclick="nextMailStep()">${isLast?'到家啦':'下一个'}</button>
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--ink-2)">${i+1} / ${_mailItems.length}</div>`;
  if(it.type==='card'){
    const c=it.data;c.seen=true;
    openModal(`<div style="text-align:center">
      <div class="pc-card" style="border-radius:14px;overflow:hidden;text-align:left">
        <div style="line-height:0">${sceneSVG(c.scene)}</div>
        <div class="pc-letter">${esc(c.text)}</div>
        <div class="pc-cap">
          <span>${SCENE_MAP[c.scene].name}${c.with?' · 和'+esc(c.with):''}${c.final?' · 归来合影':''}</span>
          <span class="rarity ${c.rarity}">${RARITY_LABEL[c.rarity]}</span>
        </div>
      </div>${nav}</div>`);
  }else{
    const s=it.data;s.seen=true;
    openModal(`<div style="text-align:center">
      <div style="display:flex;justify-content:center;margin-bottom:8px">${souvenirIconByName(s.name,s.rarity)}</div>
      <div class="modal-title">${esc(s.name)}</div>
      <div style="color:var(--ink-2);font-size:13px;margin:6px 0 0">来自${SCENE_MAP[s.scene].name} · ${RARITY_LABEL[s.rarity]}</div>
      ${nav}</div>`);
  }
  save();
}

function visitorTick(){
  if(db.pet.state!=='home'){
    if(db.visitor)db.visitor=null; // 主人不在，访客也不在
    return;
  }
  const last=db.lastVisitor||0;
  if(!db.visitor&&db.souvenirs.length>0){
    if(Date.now()-last>40*60000&&Math.random()<0.45)spawnVisitor();
  }
  if(db.visitor&&Date.now()-db.visitor.since>35*60000){
    db.visitor=null; // 等太久自己走了

function spawnVisitor(){
  const id=VISITORS[Math.floor(Math.random()*VISITORS.length)].id;

  save();SFX.visitor();

function dismissVisitor(){

function feedVisitor(sovId){
  if(!db.visitor)return;
  const idx=db.souvenirs.findIndex(s=>s.id===sovId);
  if(idx<0)return;
  const v=VISITOR_MAP[db.visitor.id];
  const sov=db.souvenirs[idx];
  const liked=v.likes.includes(sov.name);
  const reward=liked?36:18;
  let clover=false;
  db.coins+=reward;
  db.souvenirs.splice(idx,1);
  if(liked&&Math.random()<0.4){
    db.inventory.charm_clover=(db.inventory.charm_clover||0)+1;clover=true;
  }
  db.lastVisitor=Date.now();
  db.visitor=null;
  db.stats.visitors=(db.stats.visitors||0)+1;
  save();coinFly(reward);
  toast(clover?v.name+'很开心，回赠草叶和四叶草':v.name+'吃饱了，回赠 '+reward+' 草叶');
  render();

function travelProgress(){
  const p=db.pet;
  if(p.state!=='away')return 0;
  const s=new Date(p.travelStart).getTime(),e=new Date(p.travelEnd).getTime();
  return Math.min(100,Math.max(0,(Date.now()-s)/(e-s)*100));
}
function fmtEnd(iso){
  const d=new Date(iso),now=new Date();
  const hm=pad(d.getHours())+':'+pad(d.getMinutes());
  const dayMs=(x)=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((dayMs(d)-dayMs(now))/86400000);
  if(diff===0)return '今天 '+hm;
  if(diff===1)return '明天 '+hm;
  if(diff===2)return '后天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}

function season(){
  const m=new Date().getMonth()+1;
  if(m>=3&&m<=5)return 'spring';
  if(m>=6&&m<=8)return 'summer';
  if(m>=9&&m<=11)return 'autumn';
  return 'winter';
}

function seasonDecorHTML(){
  const s=season();
  const cls=s==='autumn'?'leaf-drop':s==='winter'?'snow-drop':s==='spring'?'petal-drop':'';
  if(!cls)return '';
  const n=s==='winter'?11:8;
  let out='';
  for(let i=0;i<n;i++){
    const left=4+Math.random()*92;
    const dur=7+Math.random()*7;
    const delay=-Math.random()*12;
    out+=`<span class="season-drop ${cls}" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s"></span>`;
  }
  return out;
}

function checkAchievements(){
  if(!db.stats)db.stats={trips:0,visitors:0,harvests:0};
  if(!db.achievements)db.achievements={};
  let newly=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!db.achievements[a.id]){
      try{if(a.check()){db.achievements[a.id]={at:new Date().toISOString()};newly.push(a);}}catch(e){}
    }
  });
  if(newly.length){
    save();
    const a=newly[0];
    SFX.ach();
    toast('解锁成就：'+a.name+'  +20草叶');
    db.coins+=20;save();
    setTimeout(()=>coinFly(20),300);
  }

  const text=`${c.text} —— 来自绵羊清单，${sn}的小日子`;
  if(navigator.share){
    navigator.share({title:'绵羊清单 · 明信片',text}).catch(()=>{});
  }else if(navigator.clipboard){

    toast('明信片文案已复制，去分享给朋友吧');

        <div class="diary-dot" style="background:${e.color}"></div>
        <div class="diary-card">
          <div class="diary-row">
            ${e.thumb?`<div class="diary-thumb">${e.thumb}</div>`:''}
            <div class="diary-body">
              <div class="diary-title">${e.title}</div>
              ${e.desc?`<div class="diary-desc">${e.desc}</div>`:''}
              <div class="diary-time">${diaryDate(e.date)}</div>
            </div>
          </div>
        </div>
      </div>`).join('')+'</div>';
  }
  $('#page').innerHTML=html;
}

function souvenirIcon(rarity){
  const c=rarity==='epic'?'#D9A83E':rarity==='rare'?'#5B9EBD':'#8ABF84';
  return `<svg viewBox="0 0 48 48" class="item-icon">
    <rect x="10" y="20" width="28" height="22" rx="3" fill="${c}"/>
    <rect x="10" y="16" width="28" height="7" rx="2" fill="${c}"/>
    <path d="M24 16 v26 M24 18 c-6 -8 -12 -2 -6 2 M24 18 c6 -8 12 -2 6 2" stroke="#fff" stroke-width="2" fill="none"/>
  </svg>`;
}
function souvenirIconByName(name,rarity){
  return SOUVENIR_ICONS[name]?SOUVENIR_ICONS[name]:souvenirIcon(rarity);
}
function renderBook(){
  travelTick();
  const total=SCENES.reduce((s,x)=>s+x.souvenirs.length,0);
  const got=db.souvenirs.length;
  let html=`<div class="page-head"><div class="page-title">特产图鉴</div>
    <div class="page-sub">已收集 ${got}/${total} 种</div></div>
    <div class="book-progress">它每次旅行都会带回当地的东西，慢慢收集，不用着急</div>
    <div class="book-grid">`;
  SCENES.forEach(s=>{
    s.souvenirs.forEach((nm,idx)=>{
      const have=db.souvenirs.find(x=>x.name===nm);
      const rarity=idx===0?'common':idx===1?'rare':'epic';
      html+=`<div class="sv-cell ${have?'':'locked'}">
        ${have?souvenirIconByName(nm,have.rarity):souvenirIconByName(nm,rarity)}
        <div class="nm">${have?esc(nm):'？？？'}</div>
        <div class="sc">${s.name}</div>
      </div>`;
    });
  });
  html+=`</div>`;
  $('#page').innerHTML=html;
}



function dailySurprise(){
  const today=todayStr();
  if(db.lastDailyEvent===today)return;
  db.lastDailyEvent=today;
  const show=(icon,text)=>setTimeout(()=>openModal(`
    <div style="text-align:center;padding:8px">
      <div style="display:flex;justify-content:center;margin-bottom:8px">${icon}</div>
      <div class="modal-title">今日小惊喜</div>
      <div style="color:var(--ink-2);font-size:14px;margin:10px 0 18px">${text}</div>
      <button class="btn btn-primary btn-block" onclick="closeModal()">收下啦</button>
    </div>`),900);
  const r=Math.random();
  if(r<0.4){
    const n=8+Math.floor(Math.random()*12);db.coins+=n;save();
    show(COIN_ICON,'门口有一小捧草叶，大概是它之前落下的，+'+n+' 草叶');
  }else if(r<0.7){
    const n=6+Math.floor(Math.random()*10);db.coins+=n;save();
    show(COIN_ICON,'草丛里有东西在闪光，捡到 '+n+' 草叶');
  }else if(r<0.85){
    db.inventory.charm_clover=(db.inventory.charm_clover||0)+1;save();
    show(itemIcon('charm_clover'),'屋檐下长出一株四叶草，今天会有好运');
  }else save();
}
function render(){
  // 无论在哪个页面，都推进旅行、访客、自主出发
  const before=db.pet.state;
  travelTick();visitorTick();autoTick();
  if(before!==db.pet.state||db.pet.state!==before)save();
  const view=location.hash.replace('#/','')||'today';
  const map={today:renderToday,calendar:renderCalendar,tasks:renderTasks,habits:renderHabits,stats:renderStats,settings:renderSettings,
    yard:renderYard,shop:renderShop,bag:renderBag,album:renderAlbum,book:renderBook,diary:renderDiary,room:renderRoom,ach:renderAchievements};
  (map[view]||renderToday)();
  window.scrollTo(0,0);
  const fab=$('#fab');
  if(fab)fab.style.display=['today','calendar','tasks','habits'].includes(view)?'':'none';
}
if(!location.hash)location.hash='#/today';
const _growGain=settleGrow();
if(_growGain)localStorage.setItem(STORE_KEY,JSON.stringify(db));
renderNav();renderBottomNav();render();
maybeOnboard();
dailySurprise();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if(syncCfg.token&&syncCfg.gistId&&syncCfg.auto){
  setTimeout(()=>{syncNow().catch(()=>{});},3000);
}
setInterval(()=>{if((location.hash||'#/today')==='#/today'&&!$('#timerOverlay').classList.contains('show'))updateHeroTimer();},1000);
// 小羊在家随机切换活动
setInterval(()=>{
  if(db.pet.state==='home'&&location.hash==='#/yard'&&Math.random()<0.6){
    pickHomeAct();render();
  }
},15000);
// 小羊自主拿桌上便当再出发
setInterval(()=>{
  if(db.pet.state==='home'&&db.pet.autoLeaveAt){
    const before=db.pet.state;
    autoTick();
    if(before!==db.pet.state)render();
  }
},5000);
</script>
