<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>绵羊 · 效率三件套</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#234036">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="绵羊">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 9c-1-3 1-5 1-5s3 1 3 4' fill='none' stroke='%232E7D5B' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='19' r='11' fill='%23D14E3A'/%3E%3Cpath d='M12 16c0 3 1.5 5 4 6-3 .5-6-1.5-6-5 0-2 1-3.5 2-4z' fill='%23B53C2C'/%3E%3C/svg%3E">
<script>
/* 提前应用主题，避免页面闪白 */
(function(){
  try{
    var ui=JSON.parse(localStorage.getItem('mianyang_ui')||'{}');
    var mode=ui.theme||'auto';
    var dark=mode==='dark'||(mode==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(dark)document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#202925; --ink-2:#68706A; --ink-3:#9AA19B;
  --line:#E2E4DD; --line-soft:#EDEEE8;
  --brand:#234036; --brand-soft:#E7EEEA;
  --tomato:#D14E3A; --tomato-ink:#A93827; --tomato-soft:#F8E8E4;
  --green:#2E7D5B; --green-soft:#E5F0EA;
  --amber:#BC8427; --amber-soft:#F6EEDD;
  --blue:#3D6B8F; --blue-soft:#E7EEF3;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(32,41,37,.05);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#141A17; --surface:#1E2622; --ink:#E3E8E3; --ink-2:#98A29A; --ink-3:#677169;
  --line:#2C352F; --line-soft:#262E29;
  --brand:#2E4A40; --brand-soft:#26392F;
  --tomato:#D7604D; --tomato-ink:#E08372; --tomato-soft:#3A2520;
  --green:#4E9C7D; --green-soft:#22332A;
  --amber:#C99A4E; --amber-soft:#352E1E;
  --blue:#6B95B5; --blue-soft:#21303C;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
input:not([type=checkbox]):not([type=radio]),select,textarea{background:var(--surface)}
::placeholder{color:var(--ink-3)}

/* ===== 布局 ===== */
.app{min-height:100vh;display:flex}
.sidebar{width:272px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 10px 18px;font-weight:700;font-size:17px;letter-spacing:.5px}
.brand-dot{width:26px;height:26px;border-radius:50%;background:var(--tomato);position:relative;flex:none}
.brand-dot::after{content:"";position:absolute;top:-5px;left:11px;width:8px;height:7px;background:var(--green);border-radius:80% 20% 80% 20%;transform:rotate(35deg)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav-item svg{width:19px;height:19px;flex:none}
.nav-item:hover{background:var(--line-soft);color:var(--ink)}
.nav-item.active{background:var(--brand);color:#fff}
.nav-item.active svg{stroke:#fff}
.sidebar-foot{margin-top:14px;padding:10px;font-size:12px;color:var(--ink-3);line-height:1.5}
.main{flex:1;margin-left:272px;padding:34px 30px 60px;min-width:0}
.side-sec{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:13px}
.side-title{font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:1.5px;padding:0 10px 7px}
.side-empty{padding:2px 10px;font-size:12.5px;color:var(--ink-3)}
.side-task{display:flex;align-items:flex-start;gap:8px;padding:4px 10px;border-radius:7px}
.side-task:hover{background:var(--line-soft)}
.mini-check{width:15px;height:15px;border-radius:50%;border:1.6px solid var(--cc,#B9BFB5);flex:none;margin-top:3px;cursor:pointer}
.st-title{font-size:13px;line-height:1.45;flex:1;cursor:pointer;word-break:break-word}
.st-title.over{color:var(--tomato-ink)}
.side-list{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:13.5px;width:100%;text-align:left}
.side-list:hover{background:var(--line-soft)}
.side-list .ld{width:9px;height:9px;border-radius:50%;flex:none}
.side-list .cnt{margin-left:auto;font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.page{max-width:760px;margin:0 auto}
.page-head{margin-bottom:22px}
.page-title{font-size:24px;font-weight:700;letter-spacing:.5px}
.page-sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}

/* ===== 通用组件 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card-title{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;border:1px solid transparent;transition:filter .12s,background .12s}
.btn svg{width:15px;height:15px;flex:none}
.btn:active{filter:brightness(.93)}
.btn-primary{background:var(--brand);color:#fff}
.btn-tomato{background:var(--tomato);color:#fff}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--line-soft)}
.btn-danger{background:var(--surface);border-color:var(--line);color:var(--tomato-ink)}
.btn-sm{padding:5px 11px;font-size:13px}
.btn-block{width:100%}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--line-soft)}
.icon-btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:500}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.empty{text-align:center;padding:34px 16px;color:var(--ink-3);font-size:14px}
.empty svg{width:38px;height:38px;margin-bottom:8px;stroke:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 今日页 ===== */
.hero{background:var(--brand);color:#fff;border-radius:16px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.hero-date{font-size:13.5px;opacity:.82;letter-spacing:1px}
.hero-greet{font-size:21px;font-weight:700;margin-top:2px}
.hero-pet{font-size:13px;opacity:.92;margin-top:7px;display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.16);padding:4px 11px;border-radius:20px;cursor:pointer}
.hero-start{background:var(--tomato);color:#fff;padding:13px 22px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.hero-start svg{width:18px;height:18px;fill:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.stat-num{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1.1}
.stat-num small{font-size:13px;color:var(--ink-2);font-weight:500;margin-left:2px}
.stat-label{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.section-row{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.section-row h3{font-size:15.5px;font-weight:700}
.section-row .link{font-size:13px;color:var(--ink-2)}
.section-row .link:hover{color:var(--brand)}

/* ===== 任务 ===== */
.task{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px}
.task:hover{border-color:#CDD2C8}
.check{width:21px;height:21px;border-radius:50%;border:2px solid #C4C9C0;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .check svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-title{font-weight:500;word-break:break-word}
.task.done .task-title{color:var(--ink-3);text-decoration:line-through}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500}
.tag-list{background:var(--blue-soft);color:var(--blue)}
.tag-pri-3{background:var(--tomato-soft);color:var(--tomato-ink)}
.tag-pri-2{background:var(--amber-soft);color:var(--amber)}
.tag-pri-1{background:var(--line-soft);color:var(--ink-2)}
.tag-overdue{background:var(--tomato-soft);color:var(--tomato-ink)}
.tag-pomo{background:var(--brand-soft);color:var(--brand)}
.task-actions{display:flex;gap:2px;flex:none}
.add-bar{display:flex;gap:8px;margin-bottom:14px}
.add-bar input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);outline:none}
.add-bar input:focus{border-color:var(--brand)}

/* ===== 日历 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head .m{font-size:17px;font-weight:700}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:12px;color:var(--ink-2);padding:6px 0;font-weight:600}
.cal-day{min-height:112px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:5px 6px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;text-align:left}
.cal-day.other{opacity:.38}
.cal-day.today .dnum{background:var(--brand);color:#fff;border-radius:50%;width:23px;height:23px;display:flex;align-items:center;justify-content:center}
.cal-day.sel{border-color:var(--brand);border-width:2px;padding:4px 5px}
.cal-day .dnum{font-size:13px;font-weight:600;flex:none;margin-bottom:2px}
.cal-item{display:flex;align-items:center;gap:3px;font-size:11px;line-height:1.5;margin-top:2px;padding:1px 4px 1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden}
.cal-item .ci-title{overflow:hidden;text-overflow:ellipsis}
.cal-item .ci-time{font-family:var(--mono);font-size:10px;flex:none}
.cal-item.event{background:var(--blue-soft);color:var(--blue)}
.cal-item.task{color:var(--cc);border-left:3px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--surface))}
.cal-item.task .ci-check{width:8px;height:8px;border-radius:50%;border:1.3px solid var(--cc);flex:none}
.cal-item.task.done{opacity:.5}
.cal-item.task.done .ci-check{background:var(--cc)}
.cal-item.task.done .ci-title{text-decoration:line-through}
.cal-more{font-size:10px;color:var(--ink-3);padding:2px 3px 0;flex:none}
.ev-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:8px}
.ev-time{font-family:var(--mono);font-size:13px;color:var(--blue);font-weight:600;min-width:92px;flex:none}
.ev-body{flex:1;min-width:0}
.ev-title{font-weight:500}
.ev-note{font-size:12.5px;color:var(--ink-2)}

/* ===== 日历：当日维度分组 ===== */
.dim-card{padding:16px 18px}
.dim-head{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.dim-dot{width:11px;height:11px;border-radius:50%;flex:none}
.dim-name{font-size:15px;font-weight:700}
.dim-count{margin-left:auto;font-size:12.5px;color:var(--ink-2)}
.dim-empty{font-size:13px;color:var(--ink-3);padding:8px 2px}
.dim-line{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line-soft)}
.dim-line .dim-t{flex:1;min-width:0;font-size:14px}
.dim-line.done .dim-t{color:var(--ink-3)}
.dim-line.done .dim-t{text-decoration:line-through}
.dim-rr{font-size:11px;color:var(--ink-3);font-weight:400;margin-left:6px}
.dim-time{font-family:var(--mono);font-size:12px;color:var(--ink-2);flex:none}
.dim-ic{color:var(--blue);display:flex;flex:none}
.dim-check{width:21px;height:21px;border-radius:50%;border:2px solid var(--cc,#C4C9C0);flex:none;display:flex;align-items:center;justify-content:center}
.dim-check svg{width:12px;height:12px;stroke:#fff;stroke-width:3}
.dim-line.event .dim-t{font-weight:500}

/* ===== Modal：重复规则控件 ===== */
.rr-dow{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.rr-dow.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== 习惯打卡 ===== */
.habit{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.habit-dot{width:12px;height:12px;border-radius:50%;flex:none}
.habit-body{flex:1;min-width:0}
.habit-name{font-weight:600}
.habit-streak{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.habit-check{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.habit-check svg{width:20px;height:20px;stroke:#fff;stroke-width:2.5;opacity:0}
.habit-check.done{background:var(--green);border-color:var(--green)}
.habit-check.done svg{opacity:1}
.habit-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.hg-dow{text-align:center;font-size:11px;color:var(--ink-2);padding:2px 0}
.hg-cell{aspect-ratio:1;border-radius:5px;background:var(--line-soft)}
.hg-cell.l1{background:#BFD8CB}.hg-cell.l2{background:#86B79C}.hg-cell.l3{background:#4E9270}.hg-cell.l4{background:var(--green)}
.hg-cell.future{background:#F1F2EC}
.hg-cell.today{box-shadow:inset 0 0 0 2px var(--brand)}
[data-theme="dark"] .hg-cell.l1{background:#274637}
[data-theme="dark"] .hg-cell.l2{background:#315C46}
[data-theme="dark"] .hg-cell.l3{background:#3C7659}
[data-theme="dark"] .hg-cell.l4{background:var(--green)}
[data-theme="dark"] .hg-cell.future{background:#1C231F}

/* ===== 设置 ===== */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.setting-row:last-child{border-bottom:none}
.setting-row label{font-weight:500}
.setting-row .hint{font-size:12.5px;color:var(--ink-2)}
.setting-row input[type=number]{width:74px;padding:7px 9px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
.switch{width:44px;height:25px;border-radius:999px;background:#C8CCC4;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on::after{left:21px}

/* ===== 统计页 ===== */
.chart-bars{display:flex;align-items:flex-end;gap:5px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bar-val{font-size:11px;font-family:var(--mono);color:var(--ink-2);height:16px;line-height:16px}
.bar-area{height:104px;display:flex;align-items:flex-end;width:100%;justify-content:center}
.bar{width:66%;max-width:20px;border-radius:4px 4px 0 0;background:var(--brand)}
.bar.today{background:var(--tomato)}
[data-theme="dark"] .bar{background:#4E6B5C}
[data-theme="dark"] .bar.today{background:var(--tomato)}
.bar-lab{font-size:10px;color:var(--ink-3);margin-top:5px;height:14px}
.stats-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.donut{width:128px;flex:none}
.donut-num{font-size:21px;font-weight:700;font-family:var(--mono);fill:var(--ink)}
.donut-lab{font-size:11px;fill:var(--ink-3)}
.donut-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.legend{flex:1;min-width:110px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend-name{flex:1}
.legend-val{font-family:var(--mono);color:var(--ink-2);font-size:12px}
.hr-row{margin-bottom:12px}
.hr-row:last-child{margin-bottom:0}
.hr-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.hr-name{flex:1;font-size:13.5px}
.hr-pct{font-size:12px;color:var(--ink-2);font-family:var(--mono)}
.hr-track{height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.hr-fill{height:100%;border-radius:999px}

/* ===== FAB（手机端浮动添加） ===== */
.fab{display:none}
.fab-menu{display:none}
.fab{position:fixed;right:18px;bottom:84px;width:54px;height:54px;border-radius:50%;
  background:var(--tomato);color:#fff;z-index:50;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(209,78,58,.42)}
.fab svg{width:25px;height:25px;stroke:#fff;transition:transform .2s}
.fab.open svg{transform:rotate(45deg)}
.fab-menu{position:fixed;right:18px;bottom:150px;z-index:50;flex-direction:column;
  gap:9px;align-items:flex-end}
.fab-menu .fab-item{background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:7px}
.fab-menu .fab-item svg{width:16px;height:16px}
.fab-menu.show{display:flex}

/* ===== 勾选微交互 ===== */
@keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.task.done .check{animation:checkPop .3s ease}
.habit-check.done{animation:checkPop .3s ease}

/* ===== 番茄钟浮层 ===== */
.timer-overlay{position:fixed;inset:0;background:#1E2A26;z-index:100;display:none;flex-direction:column;color:#F2F4F0}
.timer-overlay.show{display:flex}
.timer-top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px}
.timer-modes{display:flex;gap:6px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.timer-mode{padding:7px 16px;border-radius:999px;font-size:13.5px;color:rgba(255,255,255,.7);font-weight:500}
.timer-mode.active{background:#fff;color:#1E2A26;font-weight:600}
.timer-close{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7)}
.timer-close:hover{background:rgba(255,255,255,.1)}
.timer-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px}
.ring-wrap{position:relative;width:min(72vw,300px);height:min(72vw,300px)}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:10}
.ring-fg{fill:none;stroke:var(--tomato);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-pet{position:absolute;right:-10px;bottom:0;width:70px;line-height:0;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:petFloat 3s ease-in-out infinite}
@keyframes petFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ring-time{font-size:60px;font-weight:700;font-family:var(--mono);letter-spacing:1px;line-height:1}
.ring-task{font-size:14px;color:rgba(255,255,255,.65);margin-top:8px;max-width:80%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring-cycle{font-size:12.5px;color:rgba(255,255,255,.5);margin-top:4px}
.timer-controls{display:flex;gap:14px;align-items:center}
.t-btn{border-radius:999px;font-weight:700;display:flex;align-items:center;justify-content:center}
.t-btn-main{width:150px;height:56px;font-size:17px;background:var(--tomato);color:#fff}
.t-btn-sub{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}
.timer-tasksel{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);padding:9px 16px;border-radius:999px;color:rgba(255,255,255,.85);font-size:13.5px}
.timer-tasksel select{background:transparent;color:#fff;border:none;outline:none;max-width:180px}
.timer-tasksel select option{color:#222}

/* ===== Modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(24,32,28,.42);z-index:120;display:none;align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
@media(min-width:640px){
  .modal-mask{align-items:center}
  .modal{border-radius:16px}
}

/* ===== 底部导航 / 抽屉（手机） ===== */
.bottom-nav{display:none}
.menu-btn{display:none}
.drawer-mask{display:none}
.side-group-title{font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:1.5px;padding:14px 10px 6px}
.side-user{display:none}

/* ===== 响应式：手机 ===== */
@media(max-width:820px){
  .app{flex-direction:column}
  /* 侧边栏 → 抽屉 */
  .sidebar{width:278px;top:0;bottom:0;left:0;right:auto;flex-direction:column;
    border-right:1px solid var(--line);border-top:none;padding:18px 14px;
    justify-content:flex-start;transform:translateX(-100%);transition:transform .25s ease;z-index:50}
  .sidebar.open{transform:translateX(0)}
  .brand,.sidebar-foot,.side-sec{display:flex}
  .brand{padding-bottom:14px}
  .side-sec{margin-top:14px}
  .nav-item{flex-direction:row;gap:11px;width:100%;font-size:14px;padding:10px 12px;justify-content:flex-start}
  .nav-item svg{width:19px;height:19px}
  .main{margin-left:0;padding:60px 16px 96px}
  /* 汉堡 */
  .menu-btn{display:flex;position:fixed;top:12px;left:12px;z-index:45;
    width:42px;height:42px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line);align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .drawer-mask.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  /* 底部导航 */
  .bottom-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:40;
    grid-template-columns:repeat(5,1fr);align-items:end;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;
    color:var(--ink-2);justify-content:flex-end;padding:4px 0;position:relative}
  .bn-item svg{width:23px;height:23px}
  .bn-item.active{color:var(--brand)}
  .bn-item.active svg{stroke:var(--brand)}
  .bn-item.center{justify-content:flex-start}
  .bn-item.center .bn-circle{width:56px;height:56px;border-radius:50%;
    background:linear-gradient(180deg,#7FB98F,#57986E);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:2px;border:4px solid var(--surface);
    box-shadow:0 6px 15px rgba(61,122,90,.35);margin-top:-24px}
  .bn-item.center .bn-circle svg{width:27px;height:27px;stroke:#fff}
  .bn-item.center .bn-label{margin-top:0}
  .bn-item.center.active{color:var(--brand)}
  .hero{flex-direction:column;align-items:flex-start;gap:14px;padding:20px}
  .hero-start{width:100%;justify-content:center}
  .cal-day{min-height:84px;padding:3px 4px;border-radius:6px}
  .cal-item{font-size:10px;line-height:1.45;gap:2px;padding:0 3px 0 2px}
  .cal-item.task{border-left-width:2px}
  .ev-time{min-width:74px;font-size:12px}
  .fab{display:flex}
  .stats-grid2{grid-template-columns:1fr}
  .chart-bars{gap:3px}
  .bar-lab{font-size:9px}
}
/* ===== 绵羊旅行 · 小羊 ===== */
.sheep{width:100%;max-width:200px;height:auto;display:block;overflow:visible}
.sheep-idle{animation:sheepBreathe 3s ease-in-out infinite}
@keyframes sheepBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.sheep-eye{transform-box:fill-box;transform-origin:center;animation:sheepBlink 4.8s infinite}
@keyframes sheepBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sheep-walk{animation:sheepBob .55s ease-in-out infinite}
@keyframes sheepBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.sheep-zzz{animation:zzzFloat 2.4s ease-in-out infinite}
@keyframes zzzFloat{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
.sheep-sm{max-width:120px}
.sheep-xs{max-width:64px}
.coin-fly{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);color:#5B9E5B;font-weight:800;font-size:22px;z-index:200;pointer-events:none;text-shadow:0 1px 0 #fff;animation:coinFlyUp 1.4s ease-out forwards}
@keyframes coinFlyUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1.1)}}

/* ===== 小院子场景 ===== */
.yard{position:relative;border-radius:20px;overflow:hidden;min-height:380px;
  background:linear-gradient(180deg,#BBDCE8 0%,#DCEDEB 48%,#CFE3C2 100%);border:1px solid #BFD8C0}
.yard-cloud{position:absolute;background:#fff;border-radius:40px;opacity:.9}
.yard-cloud::before,.yard-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.yard-cloud.c1{width:60px;height:20px;top:34px;left:8%;animation:cloudDrift 40s linear infinite}
.yard-cloud.c1::before{width:24px;height:24px;top:-12px;left:10px}
.yard-cloud.c1::after{width:18px;height:18px;top:-8px;left:30px}
.yard-cloud.c2{width:48px;height:16px;top:70px;right:12%;animation:cloudDrift 55s linear infinite reverse}
.yard-cloud.c2::before{width:20px;height:20px;top:-10px;left:8px}
.yard-cloud.c2::after{width:15px;height:15px;top:-6px;left:24px}
@keyframes cloudDrift{0%{transform:translateX(0)}50%{transform:translateX(30px)}100%{transform:translateX(0)}}
.yard-hill-far{position:absolute;bottom:30%;left:0;right:0;height:60px}
.yard-hill-far::before{content:"";position:absolute;bottom:0;left:18%;width:42%;height:48px;background:#BFE0D2;border-radius:50% 50% 0 0;opacity:.75}
.yard-hill-far::after{content:"";position:absolute;bottom:0;right:16%;width:48%;height:58px;background:#B7DCC8;border-radius:50% 50% 0 0;opacity:.75}
.yard-hill{position:absolute;bottom:26%;left:0;right:0;height:80px}
.yard-hill::before{content:"";position:absolute;bottom:0;left:-5%;width:60%;height:70px;background:#A9D0A0;border-radius:50% 50% 0 0}
.yard-hill::after{content:"";position:absolute;bottom:0;right:-8%;width:65%;height:90px;background:#9CC694;border-radius:50% 50% 0 0}
.yard-ground{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,#8BBE83,#6FA868)}
.yard-fence{position:absolute;bottom:24%;right:10%;width:90px;height:34px;opacity:.75}
.yard-tree{position:absolute;bottom:11%;right:25%;width:94px;z-index:1}
.yard-bush{position:absolute;bottom:5%;left:20%;width:64px;z-index:3}
.yard-flower{position:absolute;bottom:3%;right:18%;width:30px;z-index:3}
.yard-sheep{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:150px;z-index:2}
.pet-heart{position:absolute;z-index:6;font-size:26px;color:#E8849B;pointer-events:none;
  text-shadow:0 2px 3px rgba(0,0,0,.15);animation:petHeart 1.4s ease-out forwards}
@keyframes petHeart{0%{opacity:0;transform:translateY(8px) scale(.6)}
  20%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.15)}}
.yard-home{position:absolute;bottom:24%;left:7%;width:78px;height:60px;z-index:1;cursor:pointer;transition:transform .2s}
.yard-home:hover{transform:translateY(-3px)}
.yard-topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;z-index:5}
.yard-coin{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:30px;padding:6px 14px;font-weight:700;color:#4E8A4E}
.yard-coin svg{width:18px;height:18px}
.yard-actions{display:flex;gap:8px}
.yard-btn{background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.yard-msg{margin-top:12px;background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink-2);border:1px solid var(--line)}
.yard-entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.yard-entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:13px;font-weight:600}
.yard-entry .sheep{margin:0 auto 6px}

/* ===== 草叶田（亲手收割） ===== */
.yard-garden{position:absolute;bottom:2%;left:30%;display:flex;gap:8px;z-index:3;align-items:flex-end}
.tuft{width:50px;height:44px;display:block;cursor:default}
.tuft.ready{cursor:pointer;animation:tuftSway 2.2s ease-in-out infinite;transform-origin:bottom center}
.tuft.ready:hover{filter:brightness(1.08)}
@keyframes tuftSway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.tuft-spark{transform-box:fill-box;transform-origin:center;animation:spark 1.4s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
.tuft-harvest{animation:harvestPop .5s ease-out forwards}
@keyframes harvestPop{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5) translateY(-22px);opacity:0}}
.garden-hint{display:inline-flex;align-items:center;gap:5px;background:var(--green-soft);color:var(--green);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px}
.yard-act-bubble{position:absolute;bottom:47%;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.93);border-radius:15px;padding:4px 13px;font-size:12px;
  font-weight:600;color:var(--ink);z-index:3;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 7px rgba(0,0,0,.1)}
.yard-act-bubble::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:rgba(255,255,255,.93);border-bottom:none}

/* ===== 四季 ===== */
.yard-season-autumn .yard-ground{background:linear-gradient(180deg,#D9B56B,#C99E54)}
.yard-season-autumn .yard-hill::before{background:#D9BE78}
.yard-season-autumn .yard-hill::after{background:#CDB066}
.yard-season-autumn .yard-hill-far::before{background:#E8D8A8}
.yard-season-autumn .yard-hill-far::after{background:#E2D09A}
.yard-season-autumn{background:linear-gradient(180deg,#C9D2C8 0%,#EEE2C0 48%,#E6D2A0 100%);border-color:#D9C99A}
.yard-season-winter .yard-ground{background:linear-gradient(180deg,#F2F6F8,#DCE7EE)}
.yard-season-winter .yard-hill::before{background:#EAF0F4}
.yard-season-winter .yard-hill::after{background:#DDE8EF}
.yard-season-winter .yard-hill-far::before{background:#EEF3F7}
.yard-season-winter .yard-hill-far::after{background:#E6EEF4}
.yard-season-winter{background:linear-gradient(180deg,#C7D6E0 0%,#E4EDF2 48%,#EAF1F5 100%);border-color:#CFDEE8}
.yard-season-spring .yard-ground{background:linear-gradient(180deg,#93C68A,#73AE6C)}
.yard-season-spring .yard-hill-far::before{background:#C8E6D4}
.yard-season-spring .yard-hill-far::after{background:#C0E0CC}
.season-drop{position:absolute;top:-12px;z-index:2;opacity:.9;animation:seasonFall linear infinite}
@keyframes seasonFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(380px) rotate(340deg)}}
.leaf-drop{width:9px;height:8px;background:#D98A3C;border-radius:0 70% 0 70%}
.snow-drop{width:7px;height:7px;background:#fff;border-radius:50%}
.petal-drop{width:8px;height:8px;background:#F6C0D8;border-radius:60% 0 60% 0}
/* ===== 访客 ===== */
.yard-visitor{position:absolute;bottom:6%;right:7%;width:108px;z-index:3}
.visitor-svg{width:100%;height:auto;display:block;animation:visitorBreathe 2.6s ease-in-out infinite;transform-origin:bottom center}
@keyframes visitorBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.visitor-bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;
  background:rgba(255,255,255,.94);border-radius:13px;padding:3px 10px;font-size:11px;
  font-weight:600;color:var(--ink);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 2px 6px rgba(0,0,0,.1)}
.visitor-bubble::after{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  border:4px solid transparent;border-bottom-color:rgba(255,255,255,.94);border-top:none}
.visitor-panel{margin-top:12px;background:var(--green-soft);border:1px solid #BFE0C4;
  border-radius:14px;padding:12px 14px;font-size:13px}
.visitor-panel b{color:var(--green)}
.visitor-foods{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.visitor-foods button{background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.visitor-foods button.liked{border-color:var(--green);color:var(--green)}
.visitor-foods button:hover{background:var(--line-soft)}
.visitor-panel .vp-foot{font-size:12px;color:var(--ink-2);margin-top:4px}

/* ===== 小羊的家（室内） ===== */
.room{position:relative;border-radius:20px;overflow:hidden;min-height:450px;
  background:linear-gradient(180deg,#F4E8D6 0%,#EADDC8 60%,#DCB894 60%,#CFAC82 100%);
  border:1px solid #D8C0A0}
.room-window{position:absolute;top:10%;left:7%;width:90px;height:100px;z-index:1}
.room-bed{position:absolute;bottom:18%;left:4%;width:150px;z-index:2}
.room-shelf{position:absolute;bottom:26%;right:5%;width:100px;height:140px;z-index:1}
.room-desk{position:absolute;bottom:16%;right:26%;width:130px;z-index:2}
.room-frame{position:absolute;top:11%;right:31%;width:72px;z-index:1}
.room-plant{position:absolute;bottom:11%;left:21%;width:48px;z-index:2}
.room-rug{position:absolute;bottom:3%;left:30%;width:240px;height:56px;z-index:1}
.room-lamp{position:absolute;top:0;left:46%;width:60px;height:70px;z-index:1}
.room-sheep{position:absolute;bottom:12%;left:36%;width:130px;z-index:3}
.room-sheep.in-bed{left:7%;bottom:24%;width:110px}
.room-back{position:absolute;top:12px;left:12px;z-index:6}
.room-desc{margin-top:12px;background:var(--surface);border-radius:12px;padding:10px 14px;
  font-size:14px;color:var(--ink-2);border:1px solid var(--line)}

/* ===== 新手引导 ===== */
.onboarding{position:fixed;inset:0;background:rgba(32,48,38,.55);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.onboarding-card{background:var(--surface);border-radius:24px;max-width:420px;width:100%;
  padding:28px 26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:onPop .3s ease-out}
@keyframes onPop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.onboarding-ill{height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.onboarding-ill svg{max-height:150px}
.onboarding-ill .it-ill{width:110px;height:110px}
.onboarding-card h2{font-size:21px;margin-bottom:8px}
.onboarding-card p{font-size:14px;color:var(--ink-2);line-height:1.7}
.onboarding-dots{display:flex;gap:7px;justify-content:center;margin:18px 0 14px}
.onboarding-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.onboarding-dots i.active{background:var(--brand);width:22px;border-radius:4px}
.onboarding-actions{display:flex;justify-content:space-between;align-items:center}
.onboarding-skip{font-size:13px;color:var(--ink-2);cursor:pointer;background:none}
.onboarding-next{min-width:92px}

/* ===== 成就 ===== */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px;
  text-align:center;transition:transform .2s}
.ach-card:not(.locked):hover{transform:translateY(-2px)}
.ach-card.locked{opacity:.62}
.ach-icon{width:58px;height:58px;margin:0 auto 8px}
.ach-name{font-size:14px;font-weight:700;margin-bottom:3px}
.ach-desc{font-size:12px;color:var(--ink-2);line-height:1.5;min-height:36px}
.ach-date{font-size:11px;color:var(--ink-2);margin-top:6px}

/* ===== 等级条 ===== */
.level-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 14px;margin-top:10px}
.lv-badge{background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;flex-shrink:0}
.lv-title{font-size:13px;font-weight:700;flex-shrink:0}
.lv-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.lv-track i{display:block;height:100%;background:linear-gradient(90deg,#7CC87C,#5BA85B);border-radius:4px;transition:width .5s}
.lv-num{font-size:11px;color:var(--ink-2);flex-shrink:0}

/* ===== 桌子 ===== */
.desk-section{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.desk-section h4{font-size:15px;margin-bottom:12px}
.desk-section h4 span{font-size:12px;color:var(--ink-2);font-weight:400}
.desk-slots{display:flex;gap:12px}
.desk-slot{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.desk-slot.filled{background:var(--green-soft);cursor:pointer;transition:transform .15s}
.desk-slot.filled:hover{transform:scale(1.05)}
.desk-slot.filled svg{width:46px;height:46px}
.desk-slot.empty{background:var(--bg);border:2px dashed var(--line);color:var(--ink-2)}

/* ===== 商店 ===== */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.shop-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.shop-item .item-icon{width:56px;height:56px;margin:2px auto 4px}
.shop-item h4{font-size:14px}
.shop-item .desc{font-size:12px;color:var(--ink-2);line-height:1.5;min-height:34px}
.shop-item .cost{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:#4E8A4E;font-size:13px}
.shop-item .cost svg{width:15px;height:15px}
.shop-cat{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.cat-chip{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.cat-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.shop-item.owned{box-shadow:0 0 0 2px var(--green)}

/* ===== 背包行囊 ===== */
.bag-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bag-col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.bag-col h4{margin-bottom:10px}
.bag-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.bag-row:hover{background:var(--line-soft)}
.bag-row .item-icon{width:36px;height:36px}
.bag-row .n{margin-left:auto;font-size:12px;color:var(--ink-2)}
.bag-mini{width:34px;height:34px}

/* ===== 明信片 & 图鉴 ===== */
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pc-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.pc-card.locked{filter:grayscale(1) brightness(.92)}
.pc-scene{display:block;width:100%;height:auto;position:relative}
.pc-stamp{position:absolute;top:8px;right:8px;width:34px;height:34px;border:2px solid rgba(190,80,70,.62);border-radius:50%;
  color:rgba(190,80,70,.78);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;
  text-align:center;transform:rotate(-14deg);background:rgba(255,255,255,.28);line-height:1.1;pointer-events:none}
.pc-letter{padding:10px 12px 4px;font-size:13px;line-height:1.55;color:var(--ink);
  background:linear-gradient(0deg,var(--green-soft),transparent 70%);font-style:italic}
.pc-cap{padding:8px 10px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.pc-cap-r{display:flex;align-items:center;gap:6px}
.pc-share{font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);padding:2px 9px;border-radius:20px;cursor:pointer}
.pc-share:hover{border-color:var(--brand);color:var(--brand)}
.rarity{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.rarity.common{background:var(--line-soft);color:var(--ink-2)}
.rarity.rare{background:var(--blue-soft);color:var(--blue)}
.rarity.epic{background:var(--amber-soft);color:var(--amber)}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.sv-cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.sv-cell .item-icon{width:44px;height:44px;margin:0 auto 4px}
.sv-cell.locked{opacity:.55}
.sv-cell.locked .item-icon{filter:grayscale(1) brightness(.6)}
.sv-cell .nm{font-size:11px;font-weight:600;line-height:1.3}
.sv-cell .sc{font-size:10px;color:var(--ink-3)}
.book-progress{font-size:13px;color:var(--ink-2);margin:2px 0 12px}
.diary{position:relative;padding-left:24px}
.diary:before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.diary-item{position:relative;margin-bottom:12px}
.diary-dot{position:absolute;left:-24px;top:15px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface)}
.diary-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.diary-row{display:flex;gap:12px}
.diary-thumb{width:72px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0;line-height:0}
.diary-thumb svg{width:100%;height:100%;display:block}
.diary-body{min-width:0}
.diary-title{font-weight:700;font-size:14px}
.diary-desc{font-size:12.5px;color:var(--ink-2);margin:3px 0 5px;line-height:1.5}
.diary-time{font-size:11px;color:var(--ink-3)}
.travel-progress{height:10px;background:var(--line-soft);border-radius:10px;overflow:hidden;margin:8px 0}
.travel-progress i{display:block;height:100%;background:linear-gradient(90deg,#7FB37A,#5B9E5B);border-radius:10px}
.pet-stat{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.pet-stat .bar{flex:1;height:8px;background:var(--line-soft);border-radius:8px;overflow:hidden}
.pet-stat .bar i{display:block;height:100%;border-radius:8px}
/* ===== 宠物移动端适配 ===== */
@media(max-width:820px){
  .bag-wrap{grid-template-columns:1fr}
  .yard{min-height:280px}
  .yard-home{width:60px;height:48px}
  .yard-sheep{width:110px}
  .yard-fence{width:64px;height:24px}
  .yard-entries{grid-template-columns:repeat(2,1fr)}
  .shop-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .album-grid{grid-template-columns:1fr}
  .book-grid{grid-template-columns:repeat(3,1fr)}
  .pc-card{border-radius:12px}
}

</button>

<script>
/* ============================================================
   绵羊 · 效率三件套 —— 单文件 PWA 原型（P0）
   数据保存在浏览器 localStorage，不上传、不联网
   ============================================================ */

/* ---------- 工具 ---------- */
const $=(s,el)=> (el||document).querySelector(s);
const $$=(s,el)=> Array.from((el||document).querySelectorAll(s));
const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=> String(n).padStart(2,'0');
const esc=s=> String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const dateStr=d=> d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDate=s=>{const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd);};
const fmtCN=s=>{const d=parseDate(s);const w=['日','一','二','三','四','五','六'][d.getDay()];return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w;};
const timeHM=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dayName=()=>['日','一','二','三','四','五','六'][new Date().getDay()];
const daysInMonth=(y,m)=> new Date(y,m+1,0).getDate();
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900);}
function openModal(html){$('#modal').innerHTML=html;$('#modalMask').classList.add('show');}
function closeModal(){$('#modalMask').classList.remove('show');$('#modal').innerHTML='';}
$('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal();});
function fabToggle(e){
  e.stopPropagation();
  $('#fabMenu').classList.toggle('show');
  $('#fab').classList.toggle('open');
}
function fabClose(){
  $('#fabMenu').classList.remove('show');
  $('#fab').classList.remove('open');
}
document.addEventListener('click',e=>{
  if($('#fabMenu').classList.contains('show')&&!e.target.closest('#fabMenu')&&!e.target.closest('#fab'))fabClose();
});

/* ---------- 数据层 ---------- */
const STORE_KEY='mianyang_app_v1';
const DIM_DEFAULTS=[{name:'工作',color:'#3D6B8F'},{name:'生活',color:'#BC8427'},{name:'健康',color:'#2E7D5B'}];
const DIM_COLOR_MAP={'工作':'#3D6B8F','生活':'#BC8427','健康':'#2E7D5B','学习':'#7A5C9E'};
const DEFAULT_DATA={
  lists:DIM_DEFAULTS,
  tasks:[], events:[], pomodoros:[], habits:[], habitLogs:[],
  settings:{focus:25,short:5,long:15,longEvery:4,sound:true,vibrate:true},
  coins:60,
  pet:{name:'小绵',state:'home',hunger:70,mood:70,exp:0,lastGrow:null,
       travelId:null,travelStart:null,travelEnd:null,bag:[],pendingMail:[],lastReturn:null},
  inventory:{},
  postcards:[],
  souvenirs:[],
  stats:{trips:0,visitors:0,harvests:0},
  achievements:{},
  desk:[],
  createdAt:null,
  updatedAt:null
};
/* ---------- 云同步（GitHub Gist，私密、自动双向） ---------- */
const SYNC_KEY='mianyang_sync_cfg';
const GIST_DESC='mianyang-sync';
const GIST_FILE='mianyang-data.json';
let syncCfg=loadSyncCfg();
function loadSyncCfg(){
  try{const raw=localStorage.getItem(SYNC_KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {token:'',gistId:'',auto:true,lastSyncAt:null};
}
function saveSyncCfg(){localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg));}
function ghApi(path,opt){
  opt=opt||{};
  return fetch('https://api.github.com'+path,{
    method:opt.method||'GET',
    headers:Object.assign({Accept:'application/vnd.github+json','User-Agent':'mianyang-app'},
      syncCfg.token?{Authorization:'Bearer '+syncCfg.token}:{},opt.headers||{}),
    body:opt.body
  }).then(async r=>{
    const txt=await r.text();
    let body;try{body=txt?JSON.parse(txt):null;}catch(e){body=txt;}
    if(!r.ok)throw new Error((body&&body.message)||('HTTP '+r.status));
    return body;
  });
}
async function syncConnect(token){
  const old=syncCfg.token;
  syncCfg.token=token.trim();
  try{
    await ghApi('/user');
    let gistId='';
    const gists=await ghApi('/gists?per_page=100');
    const found=(gists||[]).find(g=>g.description===GIST_DESC);
    if(found)gistId=found.id;
    else{
      const created=await ghApi('/gists',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({description:GIST_DESC,public:false,
          files:{[GIST_FILE]:{content:JSON.stringify({updatedAt:db.updatedAt,data:db})}}})});
      gistId=created.id;
    }
    syncCfg.gistId=gistId;saveSyncCfg();
    await syncNow();
    return true;
  }catch(e){syncCfg.token=old;throw e;}
}
let syncBusy=false,syncTimer=null;
function syncSchedule(){
  if(!syncCfg.token||!syncCfg.gistId||!syncCfg.auto)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{syncNow().catch(()=>{});},5000);
}
async function syncNow(){
  if(!syncCfg.token||!syncCfg.gistId)throw new Error('未配置');
  if(syncBusy)return;
  syncBusy=true;
  try{
    const gist=await ghApi('/gists/'+syncCfg.gistId);
    const content=gist.files&&gist.files[GIST_FILE]&&gist.files[GIST_FILE].content;
    let remote=null;
    if(content){try{remote=JSON.parse(content);}catch(e){}}
    const ru=remote&&remote.updatedAt?remote.updatedAt:null;
    const lu=db.updatedAt;
    if(ru&&(!lu||ru>lu)){
      db=migrate(remote.data);
      localStorage.setItem(STORE_KEY,JSON.stringify(db));
      render();
    }else if(!ru||(lu&&lu>ru)){
      await ghApi('/gists/'+syncCfg.gistId,{method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify({updatedAt:db.updatedAt,data:db})}}})});
    }
    syncCfg.lastSyncAt=new Date().toISOString();saveSyncCfg();
    if(location.hash==='#/settings')renderSettings();
    return true;
  }finally{syncBusy=false;}
}
function syncDisconnect(){
  syncCfg={token:'',gistId:'',auto:true,lastSyncAt:null};
  saveSyncCfg();
}
function fmtDateTime(iso){
  if(!iso)return '—';
  const d=new Date(iso);
  return (d.getMonth()+1)+'-'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

let db=load();
function migrate(d){
  d=Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)),d);
  d.lists=(d.lists||[]).map(l=> typeof l==='string'
    ?{name:l,color:DIM_COLOR_MAP[l]||'#6B736D'}:l);
  DIM_DEFAULTS.forEach(x=>{if(!d.lists.find(l=>l.name===x.name))d.lists.push(JSON.parse(JSON.stringify(x)));});
  d.tasks.forEach(t=>{
    if(t.rrule===undefined)t.rrule=null;
    if(!Array.isArray(t.doneDates))t.doneDates=[];
  });
  d.events.forEach(e=>{if(!e.list)e.list='工作';});
  d.coins=Number(d.coins)||0;
  d.pet=Object.assign({name:'小绵',state:'home',hunger:70,mood:70,exp:0,lastGrow:null,
    travelId:null,travelStart:null,travelEnd:null,bag:[],pendingMail:[],lastReturn:null,
    homeAct:'idle',destHint:null},d.pet||{});
  if(!Array.isArray(d.pet.bag))d.pet.bag=[];
  if(!Array.isArray(d.pet.pendingMail))d.pet.pendingMail=[];
  d.inventory=d.inventory||{};
  d.postcards=Array.isArray(d.postcards)?d.postcards:[];
  d.souvenirs=Array.isArray(d.souvenirs)?d.souvenirs:[];
  d.desk=Array.isArray(d.desk)?d.desk:[];
  d.stats=d.stats||{trips:0,visitors:0,harvests:0};
  d.achievements=d.achievements||{};
  if(!d.createdAt)d.createdAt=new Date().toISOString();
  return d;
}
function load(){
  let d=null;
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)d=JSON.parse(raw);}catch(e){}
  if(!d)return JSON.parse(JSON.stringify(DEFAULT_DATA));
  return migrate(d);
}
function save(){db.updatedAt=new Date().toISOString();localStorage.setItem(STORE_KEY,JSON.stringify(db));try{syncSchedule();}catch(e){}}
function setting(k){return db.settings[k];}
function listColor(name){const l=db.lists.find(x=>x.name===name);return l?l.color:'#6B736D';}

/* ============================================================
   绵羊旅行 · 游戏配置（物品 / 场景 / 特产 / 草叶规则）
   ============================================================ */
const ITEMS=[

  {id:'gear_camera',name:'旧相机',cat:'gear',cost:35,scenes:['city','sakura','countryside'],desc:'记录城市与街巷'},
  {id:'gear_bottle',name:'水壶',cat:'gear',cost:25,scenes:['sea','lake'],desc:'去水边、去海边'},
  {id:'gear_scarf',name:'毛线围巾',cat:'gear',cost:30,scenes:['snow'],desc:'去往寒冷的雪原'},
  {id:'gear_lantern',name:'小灯笼',cat:'gear',cost:30,scenes:['onsen','desert'],desc:'夜温泉与远方'},

const ITEM_MAP={};ITEMS.forEach(i=>ITEM_MAP[i.id]=i);
const SCENES=[
  {id:'mountain',name:'云雾山顶',souvenirs:['山核桃','雾顶野茶','岩上灵芝']},
  {id:'forest',name:'晨雾森林',souvenirs:['松果','野莓酱','森林菌菇']},
  {id:'sea',name:'海边',souvenirs:['小贝壳','海盐糖','彩色珊瑚']},
  {id:'lake',name:'湖畔',souvenirs:['莲子','菱角','芦苇编篮']},
  {id:'onsen',name:'温泉乡',souvenirs:['温泉馒头','柚子汤包','木质御守']},
  {id:'snow',name:'雪原',souvenirs:['雪绒花','冰窗花','热可可豆']},
  {id:'city',name:'老城街巷',souvenirs:['老邮票','桂花糖片','旧书店签']},
  {id:'sakura',name:'樱花小径',souvenirs:['樱花饼','樱花瓣','玻璃风铃']},
  {id:'countryside',name:'乡野田园',souvenirs:['麦穗','烤红薯','稻草人挂饰']},
  {id:'desert',name:'远方沙漠',souvenirs:['椰枣','沙画瓶','小驼铃']}
];
const SCENE_MAP={};SCENES.forEach(s=>SCENE_MAP[s.id]=s);
const SCENE_CARD_TEXT={

/* ---------- 重复任务引擎 ---------- */
function dowMon(date){return (parseDate(date).getDay()+6)%7+1;} // 周一=1 … 周日=7
function nthDowOfMonth(date){return Math.ceil(parseDate(date).getDate()/7);}
function isLastDow(date){const d=parseDate(date);return d.getDate()+7>daysInMonth(d.getFullYear(),d.getMonth());}
function taskOccursOn(t,date){
  if(t.rrule){
    if(t.due_date&&date<t.due_date)return false;
    const r=t.rrule,d=parseDate(date),dow=dowMon(date);
    switch(r.type){
      case 'daily': return true;
      case 'weekdays': return dow<=5;
      case 'interval':
        if(!t.due_date)return false;
        const diff=Math.round((d-new Date(t.due_date+'T00:00:00'))/86400000);
        return diff>=0&&diff%(r.interval||2)===0;
      case 'weekly': return (r.weekdays||[]).includes(dow);
      case 'monthly_date': return d.getDate()===(r.monthDate||1);
      case 'monthly_dow':
        if(dow!==(r.weekday||1))return false;
        return r.pos===-1?isLastDow(date):nthDowOfMonth(date)===(r.pos||1);
    }
    return false;
  }
  return t.due_date===date;
}
function instanceDone(t,date){
  if(t.rrule)return (t.doneDates||[]).some(x=>x.date===date);
  return t.status==='done';
}
function instanceDoneAt(t,date){
  if(t.rrule){const f=(t.doneDates||[]).find(x=>x.date===date);return f?f.completed_at:null;}
  return t.status==='done'?t.completed_at:null;
}
function toggleInstance(id,date){
  const t=db.tasks.find(x=>x.id===id);if(!t)return;
  date=date||todayStr();
  let gained=false;
  if(t.rrule){
    const i=t.doneDates.findIndex(x=>x.date===date);
    if(i>=0)t.doneDates.splice(i,1);
    else{t.doneDates.push({date,completed_at:new Date().toISOString()});
      if(date===todayStr()){awardCoins('repeat');gained=true;}}
  }else{
    if(t.status==='done'){t.status='todo';t.completed_at=null;}
    else{t.status='done';t.completed_at=new Date().toISOString();
      awardCoins('task');gained=true;}
  }
  save();render();
  if(gained){SFX.done();coinFly(AWARD_RULE[t.rrule?'repeat':'task']);gainExp(10);checkAchievements();}
}
function doneTodayCount(){
  const t=todayStr();
  return db.tasks.filter(x=> x.rrule
    ?x.doneDates.some(d=>d.date===t)
    :x.status==='done'&&x.completed_at&&x.completed_at.slice(0,10)===t).length;
}
function totalTasksDone(){
  return db.tasks.reduce((n,t)=>n+(t.rrule?(t.doneDates||[]).length:(t.status==='done'?1:0)),0);
}
function totalPomos(){return db.pomodoros.filter(x=>x.completed===1).length;}
function visitedScenes(){
  const s=new Set();
  db.postcards.forEach(p=>s.add(p.scene));
  db.souvenirs.forEach(v=>s.add(v.scene));
  return s.size;
}
function maxStreak(){
  let mx=0;
  db.habits.forEach(h=>{mx=Math.max(mx,habitStreak(h.id));});
  return mx;
}
function itemsOnDate(date){
  const evs=db.events.filter(e=>e.date===date).map(e=>({kind:'event',list:e.list||'工作',...e}));
  const ts=db.tasks.filter(t=>taskOccursOn(t,date)).map(t=>({kind:'task',...t}));
  return [...evs,...ts].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}

const TIMER_KEY='mianyang_timer_v1';
let timer=loadTimer();
function loadTimer(){
  try{const raw=localStorage.getItem(TIMER_KEY);if(raw){const t=JSON.parse(raw);t.running=!!t.running;return t;}}catch(e){}
  return {mode:'focus',running:false,remain:25*60,endAt:null,taskId:null,cycle:0,startedAt:null};
}
function saveTimer(){localStorage.setItem(TIMER_KEY,JSON.stringify(timer));}
const MODE_META={focus:{label:'专注',color:'#D14E3A'},short:{label:'短休息',color:'#2E7D5B'},long:{label:'长休息',color:'#3D6B8F'}};
function modeDur(m){return Number(setting({focus:'focus',short:'short',long:'long'}[m]))*60;}
function setMode(m){
  if(timer.running)return;
  timer.mode=m;timer.remain=modeDur(m);timer.endAt=null;timer.startedAt=null;saveTimer();renderTimer();
}
function startTimer(){
  if(timer.running)return;
  if(timer.remain<=0)timer.remain=modeDur(timer.mode);
  if(!timer.startedAt)timer.startedAt=Date.now();
  timer.endAt=Date.now()+timer.remain*1000;timer.running=true;saveTimer();renderTimer();
}
function pauseTimer(){
  if(!timer.running)return;
  timer.remain=Math.max(0,Math.round((timer.endAt-Date.now())/1000));
  timer.running=false;timer.endAt=null;saveTimer();renderTimer();
}
function resetTimer(){
  timer.running=false;timer.remain=modeDur(timer.mode);timer.endAt=null;timer.startedAt=null;saveTimer();renderTimer();
}
function stopEarly(){
  if(timer.mode==='focus'&&timer.startedAt){
    const elapsed=Math.round((Date.now()-timer.startedAt)/1000);
    if(elapsed>=60){
      db.pomodoros.push({id:uid(),task_id:timer.taskId,start_time:new Date(timer.startedAt).toISOString(),
        end_time:new Date().toISOString(),planned:modeDur('focus')/60,actual:Math.round(elapsed/60),
        mode:'focus',completed:0});
      save();
    }
  }
  toast('已结束本次计时');
  resetTimer();
}
function completeSession(){
  const dur=modeDur(timer.mode);
  if(timer.mode==='focus'){
    db.pomodoros.push({id:uid(),task_id:timer.taskId,start_time:timer.startedAt?new Date(timer.startedAt).toISOString():new Date().toISOString(),
      end_time:new Date().toISOString(),planned:dur/60,actual:dur/60,mode:'focus',completed:1});
    if(timer.taskId){const t=db.tasks.find(x=>x.id===timer.taskId);if(t)t.actual=(t.actual||0)+1;}
    timer.cycle++;
    awardCoins('pomo');
    save();
    SFX.done();
    coinFly(AWARD_RULE.pomo);
    gainExp(10);
    checkAchievements();
    notify('专注完成，休息一下吧');
    const next=(timer.cycle%setting('longEvery')===0)?'long':'short';
    timer.mode=next;
  }else{
    notify('休息结束，开始下一个番茄');
    timer.mode='focus';
  }
  timer.running=false;timer.remain=modeDur(timer.mode);timer.endAt=null;timer.startedAt=null;
  saveTimer();
  if(location.hash==='#/today'||!location.hash)renderToday();
  renderTimer();
}
function tick(){
  if(!timer.running)return;
  timer.remain=Math.max(0,Math.round((timer.endAt-Date.now())/1000));
  if(timer.remain<=0){completeSession();return;}
  if($('#timerOverlay').classList.contains('show'))updateRing();
}
setInterval(tick,500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timer.running)tick();});

function beep(times){
  if(!setting('sound'))return;
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value= i===0?880:660;
      const t0=ac.currentTime+i*0.5;
      g.gain.setValueAtTime(0.001,t0);
      g.gain.exponentialRampToValueAtTime(0.25,t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t0+0.45);
      o.start(t0);o.stop(t0+0.5);
    }
  }catch(e){}
}
function notify(msg){
  toast(msg);beep(3);
  if(setting('vibrate')&&navigator.vibrate)navigator.vibrate([250,120,250]);
  if('Notification' in window&&Notification.permission==='granted'){try{new Notification('绵羊 · 番茄钟',{body:msg});}catch(e){}}
}

function updateRing(){
  const total=modeDur(timer.mode),r=88,circ=2*Math.PI*r;
  const ratio=timer.running?Math.max(0,timer.remain/total):(timer.remain>0?timer.remain/total:0);
  $('#ringFg').style.strokeDasharray=circ;
  $('#ringFg').style.strokeDashoffset=circ*(1-ratio);
  const m=Math.floor(timer.remain/60),s=timer.remain%60;
  $('#ringTime').textContent=pad(m)+':'+pad(s);
  const t=timer.taskId?db.tasks.find(x=>x.id===timer.taskId):null;
  $('#ringTask').textContent=t?t.title:'未选择任务';
  updateTimerPet();
}

function rrLabel(r){
  if(!r)return '';
  const map={daily:'每天',weekdays:'工作日',interval:'每'+(r.interval||2)+'天',weekly:'每周',monthly_date:'每月'+(r.monthDate||1)+'号',monthly_dow:'每月'+(r.pos===-1?'最后':['','一','二','三','四'][r.pos])+['','一','二','三','四','五','六','日'][r.weekday]};
  return map[r.type]||'重复';
}
function taskModal(id){
  const t=id?db.tasks.find(x=>x.id===id):{title:'',note:'',priority:0,due_date:todayStr(),list:db.lists[0].name,estimate:1,rrule:null};
  const rrType=t.rrule?t.rrule.type:'';
  openModal(`
    <div class="modal-title">${id?'编辑任务':'新建任务'}</div>
    <div class="field"><label>任务标题</label><input id="tTitle" value="${esc(t.title)}" placeholder="要做什么？"></div>
    <div class="field-row">
      <div class="field"><label>维度</label><input id="tList" list="listOpts" value="${esc(t.list)}"><datalist id="listOpts">${db.lists.map(l=>`<option value="${esc(l.name)}">`).join('')}</datalist></div>
      <div class="field"><label>优先级</label><select id="tPri">${[[0,'无'],[1,'低'],[2,'中'],[3,'高']].map(p=>`<option value="${p[0]}" ${t.priority===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>开始/截止日期</label><input id="tDue" type="date" value="${t.due_date||''}"></div>
      <div class="field"><label>预计番茄数</label><input id="tEst" type="number" min="0" max="20" value="${t.estimate||1}"></div>
    </div>
    <div class="field"><label>重复</label>
      <select id="tRR" onchange="rrDynamic()">
        ${[['','不重复'],['daily','每天'],['weekdays','每个工作日（周一至五）'],['interval','每隔 N 天'],['weekly','每周指定星期'],['monthly_date','每月几号'],['monthly_dow','每月第几个星期几']].map(o=>`<option value="${o[0]}" ${rrType===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>
    </div>
    <div id="rrBox"></div>
    <div class="field"><label>备注</label><textarea id="tNote" placeholder="可选">${esc(t.note)}</textarea></div>
    <div class="modal-actions">
      ${id?'<button class="btn btn-danger" onclick="deleteTask(\''+id+'\')">删除</button>':''}
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTask('${id||''}')">保存</button>
    </div>`);
  setTimeout(()=>$('#tTitle').focus(),60);
  rrDynamic(t.rrule);
}
function rrDynamic(cur){
  const type=$('#tRR').value;
  cur=cur||{};
  let h='';
  if(type==='interval'){
    h=`<div class="field"><label>间隔</label><div style="display:flex;align-items:center;gap:8px">每隔
      <input id="rInterval" type="number" min="1" max="60" value="${cur.interval||2}" style="width:80px;text-align:center"> 天重复一次</div></div>`;
  }else if(type==='weekly'){
    const sel=cur.weekdays||[];
    h=`<div class="field"><label>选择星期（可多选）</label><div style="display:flex;gap:6px">
      ${[1,2,3,4,5,6,7].map(d=>`<button type="button" class="rr-dow ${sel.includes(d)?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${['','一','二','三','四','五','六','日'][d]}</button>`).join('')}</div></div>`;
  }else if(type==='monthly_date'){
    h=`<div class="field"><label>每月日期</label><div style="display:flex;align-items:center;gap:8px">每月
      <input id="rMonthDate" type="number" min="1" max="31" value="${cur.monthDate||1}" style="width:80px;text-align:center"> 号</div></div>`;
  }else if(type==='monthly_dow'){
    h=`<div class="field"><label>规则</label><div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="rPos" style="width:110px">
        ${[['1','第一个'],['2','第二个'],['3','第三个'],['4','第四个'],['-1','最后一个']].map(o=>`<option value="${o[0]}" ${String(cur.pos)==='undefined'?'':String(cur.pos)===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>
      <select id="rWeekday" style="width:110px">
        ${[1,2,3,4,5,6,7].map(d=>`<option value="${d}" ${cur.weekday===d?'selected':''}>周${['','一','二','三','四','五','六','日'][d]}</option>`).join('')}
      </select></div></div>`;
  }
  $('#rrBox').innerHTML=h;
}
function collectRrule(){
  const type=$('#tRR').value;
  if(!type)return null;
  if(type==='interval')return {type,interval:Math.max(1,Number($('#rInterval').value)||2)};
  if(type==='weekly'){const wd=$$('.rr-dow.on').map(x=>Number(x.dataset.d));if(!wd.length){toast('请至少选一个星期');return false;}return {type,weekdays:wd};}
  if(type==='monthly_date')return {type,monthDate:Math.min(31,Math.max(1,Number($('#rMonthDate').value)||1))};
  if(type==='monthly_dow')return {type,pos:Number($('#rPos').value),weekday:Number($('#rWeekday').value)};
  return {type};
}
function saveTask(id){
  const title=$('#tTitle').value.trim();
  if(!title){toast('请填写任务标题');return;}
  const list=$('#tList').value.trim()||db.lists[0].name;
  if(!db.lists.find(l=>l.name===list))db.lists.push({name:list,color:'#6B736D'});
  const rrule=collectRrule();
  if(rrule===false)return;
  const data={title,list,priority:Number($('#tPri').value),
    due_date:$('#tDue').value||null,estimate:Math.max(0,Number($('#tEst').value)||1),note:$('#tNote').value,rrule};
  if(id){
    const task=db.tasks.find(x=>x.id===id);
    Object.assign(task,data);
    if(!rrule)task.doneDates=[];
  }
  else{db.tasks.push(Object.assign({id:uid(),actual:0,status:'todo',sort:Date.now(),created_at:new Date().toISOString(),completed_at:null,doneDates:[]},data));}
  save();closeModal();render();toast('已保存');
}
function priTag(p){return p?`<span class="tag tag-pri-${p}">${['','低','中','高'][p]}优先</span>`:'';}
function taskRow(t,date){
  date=date||todayStr();
  const done=instanceDone(t,date);
  const overdue=!t.rrule&&t.due_date&&t.due_date<todayStr()&&t.status!=='done';
  const c=listColor(t.list);
  return `<div class="task ${done?'done':''}">
    <button class="check" style="${done?'':('border-color:'+c)}" onclick="toggleInstance('${t.id}','${date}')">${ICONS.check}</button>
    <div class="task-body">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        <span class="tag" style="background:${c}1f;color:${c}">${esc(t.list)}</span>${priTag(t.priority)}
        ${t.rrule?`<span class="tag tag-pomo">${rrLabel(t.rrule)}</span>`:''}
        <span class="tag tag-pomo">${t.actual||0}/${t.estimate||1} 番茄</span>
        ${!t.rrule&&t.due_date?`<span class="tag ${overdue?'tag-overdue':''}">${t.due_date===todayStr()?'今天':t.due_date}</span>`:''}
      </div>
    </div>
    <div class="task-actions">
      <button class="icon-btn" title="开始专注" onclick="openTimer('${t.id}')">${ICONS.play}</button>
      ${!t.rrule?`<button class="icon-btn" title="推迟一天" onclick="postpone('${t.id}')"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><path d="M15 13h4M17 11v4"/></svg></button>`:''}
      <button class="icon-btn" title="编辑" onclick="taskModal('${t.id}')"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
  </div>`;
}
function renderTasks(){
  const todo=db.tasks.filter(t=>t.status!=='done');
  const todayN=db.tasks.filter(t=>taskOccursOn(t,todayStr())&&!instanceDone(t,todayStr())).length;
  let list=[];
  if(taskView==='today')list=db.tasks.filter(t=>taskOccursOn(t,todayStr())&&!instanceDone(t,todayStr()));
  else if(taskView==='inbox')list=todo.filter(t=>!t.due_date&&!t.rrule);
  else if(taskView==='plan')list=todo.filter(t=>t.due_date&&!t.rrule).sort((a,b)=>a.due_date.localeCompare(b.due_date));
  else if(taskView==='all')list=todo.sort((a,b)=>a.sort-b.sort);
  else list=db.tasks.filter(t=>!t.rrule&&t.status==='done').sort((a,b)=>(b.completed_at||'').localeCompare(a.completed_at||''));
  if(filterList)list=list.filter(t=>t.list===filterList);
  const viewNames={today:'今天',inbox:'待办箱',plan:'计划',all:'全部',done:'已完成'};
  let html=`
    <div class="page-head"><div class="page-title">任务</div><div class="page-sub">共 ${todo.length} 个待办，今天 ${todayN} 个${filterList?' · 维度：'+esc(filterList):''}</div></div>
    <div class="chips">${['today','inbox','plan','all','done'].map(v=>`<button class="chip ${taskView===v?'active':''}" onclick="taskView='${v}';filterList=null;renderTasks()">${viewNames[v]}</button>`).join('')}</div>
    <div class="add-bar"><input id="quickTask" placeholder="${taskView==='inbox'?'添加到待办箱（无日期），回车创建…':'添加任务，回车快速创建（默认今天）…'}"><button class="btn btn-primary" onclick="addTaskQuick($('#quickTask').value);$('#quickTask').value=''">添加</button></div>`;
  if(taskView==='plan'&&list.length){
    const groups=[['逾期',d=>d<todayStr()],['今天',d=>d===todayStr()],['明天',d=>d===dateStr(new Date(Date.now()+86400000))],['未来',d=>d>dateStr(new Date(Date.now()+86400000))]];
    html+=groups.map(g=>{const items=list.filter(t=>g[1](t.due_date));return items.length?`<div class="section-row"><h3>${g[0]}</h3></div>${items.map(t=>taskRow(t,t.due_date)).join('')}`:'';}).join('');
  }else if(list.length){
    html+=list.map(t=>taskRow(t,t.due_date||todayStr())).join('');
  }else{
    const tips={today:'今天还没有任务，添加一个开始吧',inbox:'待办箱是空的，没有日期的任务会放在这里',plan:'还没有排期的任务',all:'这里空空的',done:'还没有完成的任务'};
    html+=`<div class="card"><div class="empty">${ICONS.tasks}<br>${tips[taskView]}</div></div>`;
  }
  html+=`<div style="margin-top:16px"><button class="btn btn-ghost btn-block" onclick="taskModal()">${ICONS.plus} 新建详细任务</button></div>`;
  $('#page').innerHTML=html;
  $('#quickTask').addEventListener('keydown',e=>{if(e.key==='Enter'){addTaskQuick(e.target.value);e.target.value='';}});
}

   日历
